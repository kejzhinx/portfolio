<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&amp;display=swap');
      text { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
      .cta-h1 { font-size: 64px; font-weight: 900; fill: #ffffff; letter-spacing: -0.025em; text-anchor: middle; }
      .cta-p { font-size: 21px; fill: #94a3b8; font-weight: 400; text-anchor: middle; }
      .footer-heading { font-size: 13px; font-weight: 900; fill: #00bfa5; letter-spacing: 0.12em; }
      .footer-subhead { font-size: 30px; font-weight: 900; fill: #ffffff; line-height: 1.25; }
      .footer-p { font-size: 15px; fill: #94a3b8; line-height: 1.6; }
      .footer-item-label { font-size: 11px; font-weight: 800; fill: #64748b; letter-spacing: 0.08em; }
      .footer-item-val { font-size: 17px; font-weight: 700; fill: #ffffff; }
      .link-text { font-size: 16px; font-weight: 500; fill: #cbd5e1; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#0b1329"/>

  <!-- Top Banner: Ready to Streamline Your Practice? -->
  <g transform="translate(960, 150)">
    <text x="0" y="40" class="cta-h1">Ready to Streamline Your Practice?</text>
    <text x="0" y="95" class="cta-p">Let's talk about how I can support your billing, prior authorization, and practice</text>
    <text x="0" y="125" class="cta-p">administrative needs.</text>

    <!-- Buttons -->
    <g transform="translate(0, 190)">
      <!-- BOOK A CALL (Teal Solid) -->
      <rect x="-240" y="0" width="220" height="60" rx="30" fill="#00bfa5"/>
      <text x="-130" y="36" text-anchor="middle" font-size="13" font-weight="900" fill="#0b1329" letter-spacing="0.08em">BOOK A CALL</text>

      <!-- SEND A MESSAGE (Outline White) -->
      <rect x="20" y="0" width="250" height="60" rx="30" fill="none" stroke="#ffffff" stroke-width="2"/>
      <text x="145" y="36" text-anchor="middle" font-size="13" font-weight="900" fill="#ffffff" letter-spacing="0.08em">SEND A MESSAGE</text>
    </g>
  </g>

  <!-- Divider Line -->
  <line x1="160" y1="520" x2="1760" y2="520" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Footer 3-Column Content Layout -->
  <g transform="translate(180, 590)">
    
    <!-- Col 1: Healthcare Practice Partner -->
    <g transform="translate(0, 0)">
      <text x="0" y="20" class="footer-heading">HEALTHCARE PRACTICE PARTNER</text>
      
      <g transform="translate(0, 70)">
        <text x="0" y="0" class="footer-subhead">Your patients deserve your full attention</text>
        <text x="0" y="40" class="footer-subhead">—let me handle the rest.</text>
      </g>

      <g transform="translate(0, 150)">
        <text x="0" y="0" class="footer-p">Providing precision prior authorization, seamless clinical administrative</text>
        <text x="0" y="26" class="footer-p">workflows, and reliable insurance verification for U.S. healthcare</text>
        <text x="0" y="52" class="footer-p">providers.</text>
      </g>

      <!-- Social Circle Icons -->
      <g transform="translate(0, 240)">
        <circle cx="20" cy="20" r="20" fill="#1e293b"/>
        <text x="20" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#00bfa5">in</text>
        
        <circle cx="75" cy="20" r="20" fill="#1e293b"/>
        <text x="75" y="24" text-anchor="middle" font-size="14" fill="#00bfa5">✉</text>

        <circle cx="130" cy="20" r="20" fill="#1e293b"/>
        <text x="130" y="24" text-anchor="middle" font-size="14" fill="#00bfa5">📞</text>

        <rect x="180" y="4" width="220" height="34" rx="8" fill="#134e4a" stroke="#2dd4bf" stroke-width="1"/>
        <text x="290" y="26" text-anchor="middle" font-size="11" font-weight="800" fill="#2dd4bf" letter-spacing="0.05em">🛡️ HIPAA Certified Specialist</text>
      </g>
    </g>

    <!-- Col 2: Get In Touch -->
    <g transform="translate(720, 0)">
      <text x="0" y="20" class="footer-heading">GET IN TOUCH</text>

      <g transform="translate(0, 60)">
        <text x="0" y="0" class="footer-item-label">EMAIL</text>
        <text x="0" y="26" class="footer-item-val">angelesadeth11@gmail.com</text>
      </g>

      <g transform="translate(0, 140)">
        <text x="0" y="0" class="footer-item-label">DIRECT CONTACT</text>
        <text x="0" y="26" class="footer-item-val">(+63) 926 041 5994</text>
      </g>

      <g transform="translate(0, 220)">
        <text x="0" y="0" class="footer-item-label">LOCATION</text>
        <text x="0" y="26" class="footer-item-val">Pasig City, Philippines</text>
        <text x="0" y="50" font-size="13" font-weight="500" fill="#00bfa5">🕒 Serving US PST, MST, CST, EST</text>
      </g>
    </g>

    <!-- Col 3: Quick Links -->
    <g transform="translate(1280, 0)">
      <text x="0" y="20" class="footer-heading">QUICK LINKS</text>

      <g transform="translate(0, 60)">
        <text x="0" y="0" class="link-text">Home</text>
        <text x="0" y="44" class="link-text">About Maria</text>
        <text x="0" y="88" class="link-text">Services</text>
        <text x="0" y="132" class="link-text">Get In Touch</text>
      </g>
    </g>

  </g>
</svg>
