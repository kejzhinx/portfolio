<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&amp;display=swap');
      text { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
      .brand-title { font-size: 15px; font-weight: 800; letter-spacing: 0.08em; fill: #1a365d; }
      .nav-link { font-size: 13px; font-weight: 600; fill: #4a5568; }
      .about-title { font-size: 46px; font-weight: 900; fill: #1a365d; letter-spacing: -0.02em; }
      .body-p { font-size: 18px; line-height: 1.6; fill: #1e293b; font-weight: 400; }
    </style>
    
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#0e6ba8" flood-opacity="0.12"/>
    </filter>
    <filter id="badge-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
    
    <clipPath id="portrait-clip">
      <rect x="0" y="0" width="420" height="520" rx="20"/>
    </clipPath>
    <clipPath id="cert-thumb-clip">
      <rect x="0" y="0" width="170" height="110" rx="10"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="#f8fafc"/>

  <!-- Top Navigation Bar -->
  <g transform="translate(140, 36)">
    <rect x="0" y="0" width="38" height="38" rx="10" fill="#0e6ba8"/>
    <text x="19" y="24" text-anchor="middle" font-size="16" font-weight="900" fill="#ffffff">MB</text>
    <text x="52" y="19" class="brand-title">MARIA BERNADETTE ESTRADA</text>
    <text x="52" y="34" font-size="11" font-weight="700" fill="#0e6ba8" letter-spacing="0.05em">HEALTHCARE VIRTUAL ASSISTANT</text>
    
    <g transform="translate(940, 24)">
      <text x="0" y="0" class="nav-link">Home</text>
      <text x="65" y="0" font-size="14" font-weight="700" fill="#0e6ba8">About</text>
      <circle cx="83" cy="9" r="2.5" fill="#0e6ba8"/>
      <text x="140" y="0" class="nav-link">How I Work</text>
      <text x="250" y="0" class="nav-link">Background</text>
      <text x="370" y="0" class="nav-link">Skills</text>
      <text x="445" y="0" class="nav-link">Services</text>
    </g>

    <rect x="1500" y="2" width="140" height="42" rx="21" fill="#0e6ba8"/>
    <text x="1570" y="28" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff" letter-spacing="0.06em">VIEW RESUME</text>
  </g>

  <line x1="140" y1="92" x2="1780" y2="92" stroke="#e2e8f0" stroke-width="1"/>

  <!-- About Main Card Container (Signature Soft Pastel Blue Card from Website) -->
  <g transform="translate(140, 130)">
    <rect width="1640" height="880" rx="32" fill="#a8d3ee" filter="url(#card-shadow)"/>
    
    <g transform="translate(60, 60)">
      
      <!-- Left: Portrait Photo Card with Top-Left HIPAA Badge -->
      <g transform="translate(40, 20)">
        
        <!-- Portrait Box -->
        <g filter="url(#card-shadow)">
          <rect width="420" height="520" rx="24" fill="#ffffff"/>
          <g transform="translate(10, 10)">
            <rect width="400" height="500" rx="18" fill="#e2e8f0"/>
            <image href="/image/maria_profile.png" x="-20" y="0" width="440" height="500" preserveAspectRatio="xMidYMin slice" clip-path="url(#portrait-clip)"/>
          </g>
        </g>

        <!-- Top-Left HIPAA Badge -->
        <g transform="translate(-25, -25) rotate(-8)" filter="url(#badge-shadow)">
          <image href="/image/maria_badge.png" x="0" y="0" width="140" height="140" preserveAspectRatio="xMidYMid meet"/>
        </g>

        <!-- Under-portrait Quick Credentials Card -->
        <g transform="translate(0, 560)">
          <rect width="420" height="110" rx="20" fill="#ffffff" filter="url(#card-shadow)"/>
          <g transform="translate(24, 30)">
            <text x="0" y="0" font-size="12" font-weight="800" fill="#0e6ba8" letter-spacing="0.1em">PRIMARY SPECIALIZATION</text>
            <text x="0" y="26" font-size="18" font-weight="800" fill="#1a365d">ENT &amp; Allergy Prior Authorization</text>
            <text x="0" y="50" font-size="13" font-weight="500" fill="#64748b">U.S. Healthcare Provider Support Specialist</text>
          </g>
        </g>
      </g>

      <!-- Right: Biography & Official Certification Card -->
      <g transform="translate(560, 20)">
        
        <!-- Section Kicker -->
        <text x="0" y="20" font-size="14" font-weight="800" fill="#0e6ba8" letter-spacing="0.12em">ABOUT MARIA BERNADETTE</text>
        
        <!-- H2 Heading -->
        <text x="0" y="70" class="about-title">Hi, I'm Maria Bernadette</text>

        <!-- Paragraphs -->
        <g transform="translate(0, 110)">
          <text x="0" y="0" class="body-p">A dedicated <tspan font-weight="700" fill="#1a365d">Healthcare Virtual Assistant</tspan> and <tspan font-weight="700" fill="#1a365d">Prior Authorization Specialist</tspan> with over</text>
          <text x="0" y="32" class="body-p"><tspan font-weight="700" fill="#0e6ba8">4 years of experience</tspan> supporting U.S. healthcare practices, particularly in</text>
          <text x="0" y="64" class="body-p"><tspan font-weight="700" fill="#1a365d">ENT (Ear, Nose, &amp; Throat)</tspan> and <tspan font-weight="700" fill="#1a365d">Allergy medicine</tspan>.</text>

          <text x="0" y="120" class="body-p">My mission is simple: to give you peace of mind knowing that the back-end</text>
          <text x="0" y="152" class="body-p">operations of your practice are managed accurately, confidentially, and efficiently—</text>
          <text x="0" y="184" class="body-p">allowing providers to dedicate 100% of their focus to patient diagnostics and care.</text>
        </g>

        <!-- Official Certification Card Container -->
        <g transform="translate(0, 345)">
          <text x="0" y="0" font-size="13" font-weight="900" fill="#1a365d" letter-spacing="0.12em">OFFICIAL CERTIFICATION PREVIEW</text>

          <!-- Real Certificate Preview Card -->
          <g transform="translate(0, 16)" filter="url(#card-shadow)">
            <rect width="940" height="150" rx="20" fill="#ffffff"/>
            
            <!-- Real Certificate Thumbnail Image -->
            <g transform="translate(20, 20)">
              <rect width="170" height="110" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
              <image href="/image/maria_certificate.jpg" x="0" y="0" width="170" height="110" preserveAspectRatio="xMidYMid slice" clip-path="url(#cert-thumb-clip)"/>
              <rect width="170" height="110" rx="12" fill="none" stroke="#0e6ba8" stroke-width="2" opacity="0.6"/>
            </g>

            <!-- Certificate Details -->
            <g transform="translate(210, 42)">
              <text x="0" y="0" font-size="18" font-weight="800" fill="#0f172a">HIPAA Awareness for Healthcare Providers</text>
              <text x="0" y="24" font-size="13" font-weight="600" fill="#64748b">HIPAATraining.com • Accredited Training Certificate</text>
              
              <g transform="translate(0, 42)">
                <!-- Pill 1 -->
                <rect x="0" y="0" width="140" height="28" rx="8" fill="#f0fdfa" stroke="#ccfbf1" stroke-width="1"/>
                <text x="70" y="18" text-anchor="middle" font-size="11" font-weight="700" fill="#0f766e">✓ 1.5 Credit Hours</text>

                <!-- Pill 2 -->
                <rect x="155" y="0" width="170" height="28" rx="8" fill="#eff6ff" stroke="#dbeafe" stroke-width="1"/>
                <text x="240" y="18" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">★ Texas HB 300 &amp; CA CMIA</text>
              </g>
            </g>

            <!-- Verified Badge -->
            <g transform="translate(780, 48)">
              <rect width="130" height="54" rx="27" fill="#0e6ba8"/>
              <text x="65" y="32" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff" letter-spacing="0.05em">VERIFIED</text>
            </g>
          </g>
        </g>

        <!-- Action Row -->
        <g transform="translate(0, 560)">
          <rect width="210" height="54" rx="27" fill="#0e6ba8" filter="url(#card-shadow)"/>
          <text x="105" y="33" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff" letter-spacing="0.08em">📄 VIEW FULL CV</text>
        </g>

      </g>

    </g>
  </g>
</svg>
