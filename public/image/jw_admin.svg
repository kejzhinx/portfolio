<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap');
      text { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }
    </style>
    <filter id="shadow-card" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000000" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Main Background -->
  <rect width="1920" height="1080" fill="#F8FAFC"/>

  <!-- Top Header Navigation -->
  <rect width="1920" height="72" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <g transform="translate(24, 16)">
    <text x="0" y="26" font-size="20" font-weight="800" fill="#E45A1B">JW Summit Group Inc.</text>
    <rect x="230" y="8" width="112" height="22" rx="6" fill="#FEF3C7"/>
    <text x="240" y="24" font-size="11" font-weight="800" fill="#B45309" letter-spacing="0.5">ADMIN CONSOLE</text>
    <text x="0" y="44" font-size="11" font-weight="500" fill="#64748B">JW Summit Group Inc. Enterprise Administration &amp; Storage</text>
  </g>

  <!-- Top Right Navigation Actions -->
  <g transform="translate(1620, 18)">
    <!-- Moon Icon -->
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="none" stroke="#64748B" stroke-width="1.8"/>
    <!-- Go to Webmail Inbox Button -->
    <rect x="40" y="-2" width="190" height="38" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="95" y="22" font-size="12" font-weight="600" fill="#E45A1B">✉ Go to Webmail Inbox →</text>
    <!-- Logout Icon -->
    <g transform="translate(245, 8)">
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" fill="none" stroke="#64748B" stroke-width="1.8"/>
    </g>
  </g>

  <!-- Left Sidebar -->
  <rect x="0" y="72" width="280" height="1008" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  
  <text x="24" y="105" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="0.5">ADMINISTRATION HUB</text>
  
  <!-- Active Tab: Mailboxes & Users -->
  <g transform="translate(16, 120)">
    <rect width="248" height="58" rx="12" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1"/>
    <circle cx="28" cy="29" r="14" fill="#FFEDD5"/>
    <text x="28" y="34" text-anchor="middle" font-size="14" fill="#EA580C">👥</text>
    <text x="56" y="26" font-size="13" font-weight="700" fill="#9A3412">Mailboxes &amp; Users</text>
    <text x="56" y="44" font-size="11" font-weight="500" fill="#C2410C">3 accounts configured</text>
    <circle cx="230" cy="29" r="4" fill="#EA580C"/>
  </g>

  <!-- Tab 2: Users Storage -->
  <g transform="translate(16, 190)">
    <rect width="248" height="54" rx="12" fill="transparent"/>
    <circle cx="28" cy="27" r="14" fill="#F1F5F9"/>
    <text x="28" y="32" text-anchor="middle" font-size="14" fill="#64748B">💾</text>
    <text x="56" y="25" font-size="13" font-weight="600" fill="#334155">Users Storage</text>
    <text x="56" y="42" font-size="11" font-weight="500" fill="#64748B">Archive &amp; Trash ZIP Exports</text>
  </g>

  <!-- Bottom Admin Badge -->
  <g transform="translate(24, 990)">
    <circle cx="20" cy="20" r="18" fill="#FFEDD5"/>
    <text x="20" y="25" text-anchor="middle" font-size="14" font-weight="700" fill="#EA580C">A</text>
    <text x="50" y="16" font-size="13" font-weight="700" fill="#0F172A">Administrator</text>
    <text x="50" y="32" font-size="11" font-weight="500" fill="#64748B">admin@playbook.com.ph</text>
  </g>

  <!-- Main Content Area -->
  <g transform="translate(320, 100)">
    <!-- 4 Metrics Cards -->
    <!-- Card 1 -->
    <g transform="translate(0, 0)" filter="url(#shadow-card)">
      <rect width="260" height="135" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="24" y="40" font-size="13" font-weight="600" fill="#64748B">Total Mailboxes</text>
      <circle cx="225" cy="35" r="16" fill="#FFF7ED"/>
      <text x="225" y="40" text-anchor="middle" font-size="14" fill="#EA580C">👥</text>
      <text x="24" y="90" font-size="34" font-weight="800" fill="#0F172A">3</text>
      <text x="24" y="115" font-size="12" font-weight="500" fill="#94A3B8">Configured accounts</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(285, 0)" filter="url(#shadow-card)">
      <rect width="260" height="135" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="24" y="40" font-size="13" font-weight="600" fill="#64748B">Active Accounts</text>
      <circle cx="225" cy="35" r="16" fill="#ECFDF5"/>
      <text x="225" y="40" text-anchor="middle" font-size="14" fill="#059669">👤</text>
      <text x="24" y="90" font-size="34" font-weight="800" fill="#0F172A">3</text>
      <text x="24" y="115" font-size="12" font-weight="600" fill="#059669">Ready for sign-in</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(570, 0)" filter="url(#shadow-card)">
      <rect width="260" height="135" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="24" y="40" font-size="13" font-weight="600" fill="#64748B">Locked Accounts</text>
      <circle cx="225" cy="35" r="16" fill="#FEF3C7"/>
      <text x="225" y="40" text-anchor="middle" font-size="14" fill="#D97706">🔒</text>
      <text x="24" y="90" font-size="34" font-weight="800" fill="#0F172A">0</text>
      <text x="24" y="115" font-size="12" font-weight="500" fill="#94A3B8">Access suspended</text>
    </g>

    <!-- Card 4 -->
    <g transform="translate(855, 0)" filter="url(#shadow-card)">
      <rect width="260" height="135" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="24" y="40" font-size="13" font-weight="600" fill="#64748B">Allocated Storage</text>
      <circle cx="225" cy="35" r="16" fill="#EFF6FF"/>
      <text x="225" y="40" text-anchor="middle" font-size="14" fill="#2563EB">💾</text>
      <text x="24" y="90" font-size="34" font-weight="800" fill="#0F172A">6 <tspan font-size="18" font-weight="600" fill="#64748B">GB</tspan></text>
      <text x="24" y="115" font-size="12" font-weight="500" fill="#64748B">213.6 MB used (3.5%)</text>
    </g>

    <!-- Table Container -->
    <g transform="translate(0, 165)" filter="url(#shadow-card)">
      <rect width="1115" height="500" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>

      <!-- Search & Controls Bar -->
      <g transform="translate(24, 24)">
        <rect width="420" height="42" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
        <text x="40" y="26" font-size="13" fill="#94A3B8">🔍 Search by name, email, department, or title...</text>

        <!-- Dropdown 1: All Roles -->
        <rect x="455" y="0" width="130" height="42" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
        <text x="475" y="26" font-size="13" font-weight="500" fill="#334155">All Roles ▾</text>

        <!-- Dropdown 2: All Status -->
        <rect x="595" y="0" width="130" height="42" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
        <text x="615" y="26" font-size="13" font-weight="500" fill="#334155">All Status ▾</text>

        <!-- Refresh Button -->
        <rect x="735" y="0" width="42" height="42" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
        <text x="750" y="26" font-size="16" fill="#64748B">⟳</text>

        <!-- + Add New Mailbox Button -->
        <rect x="787" y="0" width="170" height="42" rx="10" fill="#E45A1B"/>
        <text x="820" y="26" font-size="13" font-weight="700" fill="#FFFFFF">+ Add New Mailbox</text>
      </g>

      <!-- Table Header -->
      <line x1="24" y1="85" x2="1090" y2="85" stroke="#F1F5F9" stroke-width="1"/>
      <text x="36" y="112" font-size="11" font-weight="700" fill="#64748B" letter-spacing="0.5">USER / ACCOUNT</text>
      <text x="300" y="112" font-size="11" font-weight="700" fill="#64748B" letter-spacing="0.5">EMAIL ADDRESS</text>
      <text x="520" y="112" font-size="11" font-weight="700" fill="#64748B" letter-spacing="0.5">ROLE</text>
      <text x="660" y="112" font-size="11" font-weight="700" fill="#64748B" letter-spacing="0.5">STORAGE QUOTA</text>
      <text x="830" y="112" font-size="11" font-weight="700" fill="#64748B" letter-spacing="0.5">STATUS</text>
      <text x="960" y="112" font-size="11" font-weight="700" fill="#64748B" letter-spacing="0.5">ACTIONS</text>
      <line x1="24" y1="125" x2="1090" y2="125" stroke="#E2E8F0" stroke-width="1"/>

      <!-- Row 1: inquiry 12 -->
      <g transform="translate(0, 130)">
        <circle cx="56" cy="40" r="18" fill="#F1F5F9"/>
        <text x="56" y="46" text-anchor="middle" font-size="14" font-weight="700" fill="#475569">I</text>
        <text x="86" y="34" font-size="14" font-weight="700" fill="#0F172A">inquiry 12</text>
        <text x="86" y="52" font-size="12" font-weight="500" fill="#94A3B8">Mailbox User</text>
        <text x="300" y="44" font-size="13" font-weight="500" fill="#334155">inquiry12@playbook.com.ph</text>
        <rect x="520" y="28" width="80" height="24" rx="6" fill="#F1F5F9" stroke="#E2E8F0"/>
        <text x="536" y="44" font-size="11" font-weight="600" fill="#475569">Standard</text>
        <!-- Storage Quota Bar -->
        <text x="660" y="38" font-size="12" font-weight="700" fill="#0F172A">31 KB</text>
        <text x="785" y="38" font-size="11" font-weight="500" fill="#94A3B8">2.0 GB</text>
        <rect x="660" y="46" width="150" height="4" rx="2" fill="#E2E8F0"/>
        <rect x="660" y="46" width="6" height="4" rx="2" fill="#E45A1B"/>
        <!-- Status -->
        <rect x="830" y="28" width="70" height="24" rx="6" fill="#ECFDF5" stroke="#A7F3D0"/>
        <text x="844" y="44" font-size="11" font-weight="700" fill="#059669">✔ Active</text>
        <!-- Action Buttons -->
        <text x="960" y="44" font-size="16" fill="#64748B">🔓   ✏️   🗑</text>
      </g>
      <line x1="24" y1="210" x2="1090" y2="210" stroke="#F1F5F9" stroke-width="1"/>

      <!-- Row 2: service3@playbook.com.ph -->
      <g transform="translate(0, 215)">
        <circle cx="56" cy="40" r="18" fill="#F1F5F9"/>
        <text x="56" y="46" text-anchor="middle" font-size="14" font-weight="700" fill="#475569">S</text>
        <text x="86" y="34" font-size="14" font-weight="700" fill="#0F172A">service3@playbook.com.ph</text>
        <text x="86" y="52" font-size="12" font-weight="500" fill="#94A3B8">Mailbox User</text>
        <text x="300" y="44" font-size="13" font-weight="500" fill="#334155">service3@playbook.com.ph</text>
        <rect x="520" y="28" width="80" height="24" rx="6" fill="#F1F5F9" stroke="#E2E8F0"/>
        <text x="536" y="44" font-size="11" font-weight="600" fill="#475569">Standard</text>
        <text x="660" y="38" font-size="12" font-weight="700" fill="#0F172A">94 MB</text>
        <text x="785" y="38" font-size="11" font-weight="500" fill="#94A3B8">2.0 GB</text>
        <rect x="660" y="46" width="150" height="4" rx="2" fill="#E2E8F0"/>
        <rect x="660" y="46" width="18" height="4" rx="2" fill="#E45A1B"/>
        <rect x="830" y="28" width="70" height="24" rx="6" fill="#ECFDF5" stroke="#A7F3D0"/>
        <text x="844" y="44" font-size="11" font-weight="700" fill="#059669">✔ Active</text>
        <text x="960" y="44" font-size="16" fill="#64748B">🔓   ✏️   🗑</text>
      </g>
      <line x1="24" y1="295" x2="1090" y2="295" stroke="#F1F5F9" stroke-width="1"/>

      <!-- Row 3: Administrator (YOU) -->
      <g transform="translate(0, 300)">
        <circle cx="56" cy="40" r="18" fill="#F1F5F9"/>
        <text x="56" y="46" text-anchor="middle" font-size="14" font-weight="700" fill="#475569">A</text>
        <text x="86" y="34" font-size="14" font-weight="700" fill="#0F172A">Administrator <tspan fill="#EA580C" font-size="10" font-weight="800">YOU</tspan></text>
        <text x="86" y="52" font-size="12" font-weight="500" fill="#94A3B8">Systems Administrator</text>
        <text x="300" y="44" font-size="13" font-weight="500" fill="#334155">admin@playbook.com.ph</text>
        <!-- Administrator Badge -->
        <rect x="520" y="25" width="112" height="22" rx="6" fill="#F3E8FF" stroke="#D8B4FE"/>
        <text x="532" y="40" font-size="11" font-weight="700" fill="#7E22CE">👑 Administrator</text>
        <text x="520" y="60" font-size="10" font-weight="600" fill="#94A3B8">Local (No Bluehost)</text>
        <text x="660" y="38" font-size="12" font-weight="700" fill="#0F172A">120 MB</text>
        <text x="785" y="38" font-size="11" font-weight="500" fill="#94A3B8">2.0 GB</text>
        <rect x="660" y="46" width="150" height="4" rx="2" fill="#E2E8F0"/>
        <rect x="660" y="46" width="24" height="4" rx="2" fill="#E45A1B"/>
        <rect x="830" y="28" width="70" height="24" rx="6" fill="#ECFDF5" stroke="#A7F3D0"/>
        <text x="844" y="44" font-size="11" font-weight="700" fill="#059669">✔ Active</text>
        <text x="960" y="44" font-size="16" fill="#64748B">🔓   ✏️   🗑</text>
      </g>
    </g>
  </g>
</svg>
