<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap');
      text { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#F8FAFC"/>

  <!-- Top Navbar -->
  <rect width="1920" height="68" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <g transform="translate(24, 16)">
    <text x="0" y="24" font-size="18" font-weight="800" fill="#E45A1B">JW Summit Group Inc.</text>
    <text x="0" y="40" font-size="11" font-weight="500" fill="#64748B">Corporate Webmail</text>
  </g>

  <!-- Left Sidebar (Mail/App) -->
  <rect x="0" y="68" width="260" height="1012" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <g transform="translate(16, 84)">
    <rect width="42" height="42" rx="10" fill="#E45A1B"/>
    <text x="21" y="27" text-anchor="middle" font-size="18" fill="#FFFFFF">✉</text>
    <text x="52" y="20" font-size="14" font-weight="700" fill="#0F172A">inquiry 12</text>
    <text x="52" y="36" font-size="11" font-weight="500" fill="#94A3B8">inquiry12@playbook.com.ph</text>
  </g>
  <rect x="16" y="146" width="228" height="44" rx="10" fill="#E45A1B"/>
  <text x="130" y="174" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">+ Compose Email</text>
  <g transform="translate(16, 210)"><text x="12" y="24" font-size="13" fill="#64748B">📥   Inbox</text></g>
  <g transform="translate(16, 250)"><text x="12" y="24" font-size="13" fill="#64748B">✈   Sent</text></g>
  <!-- Messenger Active Tab -->
  <g transform="translate(16, 610)">
    <rect width="228" height="42" rx="8" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1"/>
    <text x="12" y="26" font-size="13" font-weight="700" fill="#C2410C">💬   Messenger / Chat</text>
  </g>

  <!-- Middle Column: Messenger Channels (320px) -->
  <rect x="260" y="68" width="320" height="1012" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <g transform="translate(280, 95)">
    <text x="0" y="16" font-size="16" font-weight="800" fill="#0F172A">JW Messenger</text>
    <text x="0" y="34" font-size="11" font-weight="500" fill="#64748B">Direct &amp; Corporate Chat</text>
    <text x="250" y="20" font-size="14" fill="#64748B">🔊  ⟳</text>
  </g>

  <!-- Search Colleagues -->
  <g transform="translate(280, 145)">
    <rect width="280" height="36" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="20" y="22" font-size="12" fill="#94A3B8">🔍 Search colleagues...</text>
  </g>

  <!-- Company Room (Active) -->
  <g transform="translate(280, 200)">
    <rect width="280" height="64" rx="10" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1"/>
    <circle cx="28" cy="32" r="14" fill="#EA580C"/>
    <text x="28" y="37" text-anchor="middle" font-size="14" fill="#FFFFFF">🏢</text>
    <text x="52" y="25" font-size="13" font-weight="700" fill="#9A3412">🏢 Company Room</text>
    <text x="52" y="44" font-size="11" fill="#C2410C">General broadcast for all members</text>
    <rect x="215" y="14" width="55" height="18" rx="6" fill="#EA580C"/>
    <text x="242" y="27" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">1 online</text>
  </g>

  <text x="280" y="295" font-size="10" font-weight="700" fill="#94A3B8" letter-spacing="0.5">GROUP CHATS</text>
  <g transform="translate(280, 310)">
    <circle cx="20" cy="20" r="14" fill="#FFF7ED"/>
    <text x="20" y="25" text-anchor="middle" font-size="12" fill="#EA580C">👥</text>
    <text x="45" y="16" font-size="13" font-weight="600" fill="#0F172A">GC KA SOHO</text>
    <text x="45" y="32" font-size="11" fill="#64748B">2 members</text>
  </g>

  <text x="280" y="380" font-size="10" font-weight="700" fill="#94A3B8" letter-spacing="0.5">DIRECT MESSAGES</text>
  <g transform="translate(280, 395)">
    <circle cx="20" cy="20" r="14" fill="#F1F5F9"/>
    <text x="20" y="25" text-anchor="middle" font-size="12" fill="#475569">S</text>
    <text x="45" y="16" font-size="13" font-weight="600" fill="#0F172A">service3@playbook.com.ph</text>
    <text x="45" y="32" font-size="11" fill="#94A3B8">test message</text>
    <text x="220" y="16" font-size="10" fill="#94A3B8">05:10 PM</text>
  </g>

  <!-- Right Pane: Active Chat Room (1340px) -->
  <rect x="580" y="68" width="1340" height="1012" fill="#FFFFFF"/>
  
  <!-- Chat Header -->
  <g transform="translate(600, 95)">
    <rect width="40" height="40" rx="10" fill="#EA580C"/>
    <text x="20" y="26" text-anchor="middle" font-size="18" fill="#FFFFFF">🏢</text>
    <circle cx="36" cy="36" r="4" fill="#10B981" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="52" y="20" font-size="16" font-weight="800" fill="#0F172A">JW Summit Company Room</text>
    <text x="52" y="38" font-size="12" fill="#64748B">Broadcast to all company staff • 1 active members</text>
    <text x="1270" y="26" font-size="16" fill="#64748B">🔊</text>
  </g>
  <line x1="580" y1="135" x2="1920" y2="135" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Messages Conversation Area -->
  <!-- Message from Administrator -->
  <g transform="translate(600, 220)">
    <text x="0" y="0" font-size="11" font-weight="800" fill="#EA580C">Administrator</text>
    <rect x="0" y="12" width="105" height="46" rx="12" fill="#F1F5F9"/>
    <text x="16" y="40" font-size="14" font-weight="600" fill="#0F172A">Room test!</text>
    <!-- Reaction Bubble -->
    <rect x="3" y="64" width="70" height="24" rx="12" fill="#FEF3C7" stroke="#FDE68A"/>
    <text x="14" y="80" font-size="11" font-weight="700" fill="#92400E">👍 1  ❤️ 1</text>
    <text x="0" y="105" font-size="10" fill="#94A3B8">08:49 AM</text>
  </g>

  <!-- Message from inquiry 12 (Right Aligned Orange Bubbles) -->
  <g transform="translate(1820, 180)">
    <rect x="-60" y="0" width="60" height="42" rx="20" fill="#EA580C"/>
    <text x="-30" y="26" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">hays</text>
    <text x="-65" y="48" font-size="10" fill="#94A3B8">01:09 PM</text>
  </g>
  <g transform="translate(1820, 250)">
    <rect x="-60" y="0" width="60" height="42" rx="20" fill="#EA580C"/>
    <text x="-30" y="26" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">huy</text>
    <text x="-65" y="48" font-size="10" fill="#94A3B8">02:04 PM</text>
  </g>

  <!-- Bottom Message Bar -->
  <rect x="580" y="970" width="1340" height="110" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <g transform="translate(620, 995)">
    <text x="10" y="32" font-size="18" fill="#94A3B8">📎   😊</text>
    <rect x="80" y="0" width="1070" height="52" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="100" y="32" font-size="14" fill="#94A3B8">Message Company Room...</text>
    <!-- Send Button -->
    <rect x="1170" y="0" width="100" height="52" rx="10" fill="#E45A1B"/>
    <text x="1220" y="32" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Send ✈</text>
  </g>
</svg>
