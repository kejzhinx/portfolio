<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap');
      text { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#F8FAFC"/>

  <!-- Top Navbar -->
  <rect width="1920" height="68" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <g transform="translate(24, 16)">
    <text x="0" y="24" font-size="18" font-weight="800" fill="#E45A1B">JW Summit Group Inc.</text>
    <text x="0" y="40" font-size="11" font-weight="500" fill="#64748B">Corporate Webmail</text>
  </g>

  <!-- Search Bar -->
  <g transform="translate(680, 14)">
    <rect width="560" height="40" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="24" y="25" font-size="13" fill="#94A3B8">🔍 Search messages, senders, or attachments...</text>
  </g>

  <!-- Top Right Actions -->
  <g transform="translate(1760, 24)">
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="none" stroke="#64748B" stroke-width="1.8"/>
    <text x="45" y="16" font-size="13" font-weight="700" fill="#DC2626">↪ Sign Out</text>
  </g>

  <!-- 3 Column Layout -->
  <!-- Column 1: Mailbox Sidebar (260px) -->
  <rect x="0" y="68" width="260" height="1012" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  
  <!-- Current User Header -->
  <g transform="translate(16, 84)">
    <rect width="42" height="42" rx="10" fill="#E45A1B"/>
    <text x="21" y="27" text-anchor="middle" font-size="18" fill="#FFFFFF">✉</text>
    <text x="52" y="20" font-size="14" font-weight="700" fill="#0F172A">inquiry 12</text>
    <text x="52" y="36" font-size="11" font-weight="500" fill="#94A3B8">inquiry12@playbook.com.ph</text>
  </g>

  <!-- Compose Email Button -->
  <rect x="16" y="146" width="228" height="44" rx="10" fill="#E45A1B"/>
  <text x="130" y="174" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">+ Compose Email</text>

  <!-- Mailboxes Navigation -->
  <text x="16" y="222" font-size="10" font-weight="700" fill="#94A3B8" letter-spacing="0.5">MAILBOXES</text>
  
  <g transform="translate(16, 235)">
    <text x="12" y="24" font-size="13" font-weight="600" fill="#475569">📥   Inbox</text>
  </g>
  
  <!-- Sent Tab (Active) -->
  <g transform="translate(16, 275)">
    <rect width="228" height="38" rx="8" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1"/>
    <text x="12" y="24" font-size="13" font-weight="700" fill="#C2410C">✈   Sent</text>
  </g>
  <g transform="translate(16, 320)"><text x="12" y="24" font-size="13" font-weight="600" fill="#475569">🛡   Spam</text></g>
  <g transform="translate(16, 360)"><text x="12" y="24" font-size="13" font-weight="600" fill="#475569">🗄   Archive</text></g>
  <g transform="translate(16, 400)"><text x="12" y="24" font-size="13" font-weight="600" fill="#475569">📄   Drafts</text></g>
  <g transform="translate(16, 440)"><text x="12" y="24" font-size="13" font-weight="600" fill="#475569">🗑   Trash</text></g>

  <text x="16" y="505" font-size="10" font-weight="700" fill="#94A3B8" letter-spacing="0.5">CUSTOM FOLDERS</text>
  <g transform="translate(16, 520)"><text x="12" y="24" font-size="13" font-weight="600" fill="#C2410C">📁   VIP CLIENT</text></g>

  <text x="16" y="585" font-size="10" font-weight="700" fill="#94A3B8" letter-spacing="0.5">APPS &amp; MESSAGING</text>
  <g transform="translate(16, 600)"><text x="12" y="24" font-size="13" font-weight="600" fill="#475569">💬   Messenger / Chat</text></g>

  <!-- Storage Quota at bottom -->
  <g transform="translate(16, 1000)">
    <text x="0" y="16" font-size="11" font-weight="600" fill="#64748B">💾 Mail Storage</text>
    <text x="150" y="16" font-size="11" font-weight="500" fill="#64748B">0.03 MB / 2.0 GB</text>
    <rect x="0" y="25" width="228" height="4" rx="2" fill="#E2E8F0"/>
    <rect x="0" y="25" width="8" height="4" rx="2" fill="#E45A1B"/>
    <text x="0" y="46" font-size="11" font-weight="600" fill="#059669">Host Device Quota: 2.0 GB free</text>
  </g>

  <!-- Column 2: Email List (820px) -->
  <rect x="260" y="68" width="820" height="1012" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <!-- Actions header -->
  <g transform="translate(280, 85)">
    <rect x="0" y="0" width="16" height="16" rx="3" fill="#E45A1B"/>
    <text x="26" y="13" font-size="12" font-weight="600" fill="#334155">1 selected</text>
    <text x="120" y="13" font-size="14" fill="#64748B">↩   ✉   🗄   🗑</text>
    <text x="770" y="13" font-size="16" fill="#64748B">⟳</text>
  </g>
  <line x1="260" y1="115" x2="1080" y2="115" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Email Item 1 -->
  <g transform="translate(280, 135)">
    <rect x="0" y="0" width="16" height="16" rx="3" stroke="#CBD5E1" fill="#FFFFFF"/>
    <text x="26" y="14" font-size="14" font-weight="700" fill="#0F172A">inquiry12</text>
    <text x="680" y="14" font-size="11" fill="#94A3B8">✉  ⭐  Sep 30, 06:27 AM</text>
    <text x="26" y="36" font-size="13" font-weight="600" fill="#334155">tist imil</text>
    <text x="26" y="56" font-size="12" fill="#94A3B8">test</text>
  </g>
  <line x1="260" y1="215" x2="1080" y2="215" stroke="#F1F5F9" stroke-width="1"/>

  <!-- Email Item 2 -->
  <g transform="translate(280, 235)">
    <rect x="0" y="0" width="16" height="16" rx="3" stroke="#CBD5E1" fill="#FFFFFF"/>
    <text x="26" y="14" font-size="14" font-weight="700" fill="#0F172A">inquiry12</text>
    <text x="680" y="14" font-size="11" fill="#94A3B8">✉  ⭐  Sep 30, 06:27 AM</text>
    <text x="26" y="36" font-size="13" font-weight="600" fill="#334155">tist imil</text>
    <text x="26" y="56" font-size="12" fill="#94A3B8">test</text>
  </g>
  <line x1="260" y1="315" x2="1080" y2="315" stroke="#F1F5F9" stroke-width="1"/>

  <!-- Email Item 3 -->
  <g transform="translate(280, 335)">
    <rect x="0" y="0" width="16" height="16" rx="3" stroke="#CBD5E1" fill="#FFFFFF"/>
    <text x="26" y="14" font-size="14" font-weight="700" fill="#0F172A">inquiry12</text>
    <text x="680" y="14" font-size="11" fill="#94A3B8">✉  ⭐  Sep 28, 07:50 AM</text>
    <text x="26" y="36" font-size="13" font-weight="600" fill="#334155">Re: test</text>
    <text x="26" y="56" font-size="12" fill="#94A3B8">TEST Thank you. Regards, Jason Bonita / Dan / Jeric De Los Reyes I.T Technician JW S</text>
  </g>

  <!-- Column 3: Message Detail View (840px) -->
  <rect x="1080" y="68" width="840" height="1012" fill="#FFFFFF"/>
  <!-- Actions bar -->
  <g transform="translate(1110, 85)">
    <text x="0" y="14" font-size="13" font-weight="600" fill="#EA580C">↩ Reply</text>
    <text x="80" y="14" font-size="13" font-weight="500" fill="#64748B">⭐</text>
    <text x="120" y="14" font-size="13" font-weight="600" fill="#E45A1B">📁 Move</text>
    <text x="200" y="14" font-size="13" fill="#64748B">🗑</text>
    <rect x="235" y="-5" width="110" height="30" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="250" y="15" font-size="12" font-weight="600" fill="#475569">✉ Mark Unread</text>
    <text x="750" y="14" font-size="14" fill="#64748B">🖨</text>
  </g>
  <line x1="1080" y1="115" x2="1920" y2="115" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Email Subject & Details -->
  <g transform="translate(1110, 170)">
    <text x="0" y="0" font-size="28" font-weight="800" fill="#0F172A">tist imil</text>
    
    <g transform="translate(0, 40)">
      <circle cx="20" cy="20" r="18" fill="#FFEDD5"/>
      <text x="20" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#EA580C">I</text>
      <text x="50" y="18" font-size="14" font-weight="700" fill="#0F172A">inquiry12 <tspan font-weight="500" fill="#64748B">&lt;inquiry12@playbook.com.ph&gt;</tspan></text>
      <text x="50" y="36" font-size="12" fill="#94A3B8">test</text>
      <text x="680" y="24" font-size="11" fill="#94A3B8">Sep 30, 06:27 AM</text>
    </g>

    <!-- Body -->
    <text x="0" y="140" font-size="15" fill="#1E293B">test</text>

    <!-- Metadata Card -->
    <rect x="0" y="180" width="760" height="90" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="20" y="210" font-size="12" font-weight="700" fill="#475569">From: <tspan font-weight="500" fill="#64748B">inquiry12 &lt;inquiry12@playbook.com.ph&gt;</tspan></text>
    <text x="20" y="235" font-size="12" font-weight="700" fill="#475569">To: <tspan font-weight="500" fill="#64748B">service3 &lt;service3@playbook.com.ph&gt;</tspan></text>
    <text x="20" y="260" font-size="12" font-weight="700" fill="#475569">Date: <tspan font-weight="500" fill="#64748B">Sep 30, 06:27 AM</tspan></text>

    <!-- Quick Reply Composer -->
    <text x="0" y="320" font-size="11" font-weight="800" fill="#475569" letter-spacing="0.5">QUICK REPLY</text>
    <rect x="0" y="335" width="760" height="120" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="20" y="365" font-size="13" fill="#94A3B8">Quick reply to inquiry12...</text>

    <!-- Quick Reply Footer -->
    <text x="0" y="495" font-size="11" fill="#64748B" class="mono">Encrypted with TLS 1.3 Transport</text>
    <rect x="610" y="470" width="150" height="38" rx="8" fill="#E45A1B"/>
    <text x="645" y="494" font-size="12" font-weight="700" fill="#FFFFFF">✈ Send Quick Reply</text>
  </g>
</svg>
