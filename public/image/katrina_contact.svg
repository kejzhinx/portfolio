<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap');
      text { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
      .serif { font-family: Georgia, 'Times New Roman', serif; font-weight: 400; }
      .kicker { font-size: 12px; font-weight: 800; letter-spacing: 0.2em; fill: #b87b70; text-transform: uppercase; }
      .title { font-size: 46px; fill: #2c2426; letter-spacing: -0.015em; }
      .lead { font-size: 17px; fill: #6e6264; line-height: 1.6; font-weight: 400; }
    </style>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#b87b70" flood-opacity="0.08"/>
    </filter>
    <filter id="btn-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#2c2426" flood-opacity="0.12"/>
    </filter>
  </defs>


  <rect width="1920" height="1080" fill="#fcf9f7"/>
  
  <!-- Top Navigation Bar -->
  <g transform="translate(160, 36)">
    <text x="0" y="24" font-size="15" font-weight="800" fill="#2c2426" letter-spacing="1.5">✦ KATRINA REGALADO</text>
    <g transform="translate(980, 24)">
      <text x="0" y="0" font-size="13" font-weight="600" fill="#6e6264">ABOUT</text>
<text x="90" y="0" font-size="13" font-weight="600" fill="#6e6264">SKILLS</text>
<text x="180" y="0" font-size="13" font-weight="600" fill="#6e6264">EXPERIENCE</text>
<text x="310" y="0" font-size="13" font-weight="600" fill="#6e6264">TOOLS</text>
<text x="400" y="0" font-size="13" font-weight="800" fill="#b87b70">CONTACT</text>
<circle cx="428" cy="8" r="2.5" fill="#b87b70"/>

    </g>
    <!-- Get In Touch Button -->
    <rect x="1450" y="0" width="130" height="38" rx="10" fill="#2c2426"/>
    <text x="1515" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">GET IN TOUCH</text>
  </g>
  <line x1="160" y1="92" x2="1760" y2="92" stroke="#ebded7" stroke-width="1"/>


  <!-- Contact Compact Card Container matching .contact-compact-card -->
  <g transform="translate(260, 240)" filter="url(#card-shadow)">
    <rect width="1400" height="540" rx="24" fill="#ffffff" stroke="#ebdcd4" stroke-width="1"/>

    <!-- Left Side: Actions -->
    <g transform="translate(60, 60)">
      <text x="0" y="0" class="kicker">GET IN TOUCH</text>
      <text x="0" y="52" class="serif" font-size="34" fill="#2c2426">Let's discuss how I can support you.</text>
      <text x="0" y="95" font-size="14.5" fill="#6e6264" width="540">Available for administrative support, data management, and virtual assistant roles. Reach out directly through the channels below.</text>

      <g transform="translate(0, 170)">
        <!-- SEND AN EMAIL Button -->
        <rect width="200" height="48" rx="10" fill="#2c2426" filter="url(#btn-shadow)"/>
        <text x="100" y="30" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF" letter-spacing="1">SEND AN EMAIL</text>

        <!-- Status Dot & text -->
        <g transform="translate(0, 80)">
          <circle cx="5" cy="5" r="4" fill="#10b981"/>
          <circle cx="5" cy="5" r="7" fill="none" stroke="#10b981" stroke-opacity="0.3" stroke-width="2"/>
          <text x="24" y="9" font-size="12" font-weight="600" fill="#6e6264">Available for Opportunities</text>
        </g>
      </g>
    </g>

    <!-- Center Vertical Divider line matching .contact-compact-divider -->
    <line x1="680" y1="60" x2="680" y2="480" stroke="#ebdcd4" stroke-width="1"/>

    <!-- Right Side: Channels & Timezone -->
    <g transform="translate(740, 100)">
      <!-- Channel 1: Email Box -->
      <rect width="580" height="88" rx="12" fill="#fdfaf8" stroke="#ebdcd4" stroke-width="1"/>
      <g transform="translate(20, 20)">
        <rect width="48" height="48" rx="8" fill="#fbf0eb"/>
        <text x="24" y="32" text-anchor="middle" font-size="20" fill="#b87b70">✉</text>
        <g transform="translate(64, 10)">
          <text x="0" y="10" font-size="10" font-weight="700" fill="#9c8f92" letter-spacing="1">DIRECT EMAIL</text>
          <text x="0" y="30" font-size="15" font-weight="600" fill="#2c2426">regaladokatrina026@gmail.com</text>
        </g>
        <rect x="460" y="8" width="70" height="34" rx="8" fill="#FFFFFF" stroke="#ebded7"/>
        <text x="495" y="30" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2c2426">Copy</text>
      </g>

      <!-- Timezone Strip matching .compact-timezone-strip -->
      <g transform="translate(0, 120)">
        <rect width="580" height="60" rx="10" fill="#f9f0ec" stroke="#ebdcd4" stroke-width="1"/>
        <g transform="translate(20, 20)">
          <text x="0" y="17" font-size="18" fill="#b87b70">🌐</text>
          <text x="32" y="17" font-size="12" font-weight="500" fill="#6e6264">Timezone flexible · Remote Worldwide · Rapid Response</text>
        </g>
      </g>

      <!-- Dedicated Support Badge -->
      <g transform="translate(0, 210)">
        <rect width="580" height="80" rx="12" fill="#ffffff" stroke="#ebded7" stroke-width="1"/>
        <g transform="translate(20, 22)">
          <text x="0" y="16" font-size="14" font-weight="700" fill="#2c2426">✦ Dependable Support &amp; Punctual Communication</text>
          <text x="0" y="38" font-size="12" fill="#6e6264">Comfortable working across US, European, or Asian time zones with full accountability.</text>
        </g>
      </g>
    </g>
  </g>
</svg>
