<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap');
      text { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
      .serif { font-family: Georgia, 'Times New Roman', serif; font-weight: 400; }
      .kicker { font-size: 12px; font-weight: 800; letter-spacing: 0.2em; fill: #b87b70; text-transform: uppercase; }
      .title { font-size: 46px; fill: #2c2426; letter-spacing: -0.015em; }
      .lead { font-size: 17px; fill: #6e6264; line-height: 1.6; font-weight: 400; }
    </style>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#b87b70" flood-opacity="0.08"/>
    </filter>
    <filter id="btn-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#2c2426" flood-opacity="0.12"/>
    </filter>
  </defs>


  <rect width="1920" height="1080" fill="#fcf9f7"/>
  
  <!-- Top Navigation Bar -->
  <g transform="translate(160, 36)">
    <text x="0" y="24" font-size="15" font-weight="800" fill="#2c2426" letter-spacing="1.5">✦ KATRINA REGALADO</text>
    <g transform="translate(980, 24)">
      <text x="0" y="0" font-size="13" font-weight="600" fill="#6e6264">ABOUT</text>
<text x="90" y="0" font-size="13" font-weight="600" fill="#6e6264">SKILLS</text>
<text x="180" y="0" font-size="13" font-weight="800" fill="#b87b70">EXPERIENCE</text>
<circle cx="220" cy="8" r="2.5" fill="#b87b70"/>
<text x="310" y="0" font-size="13" font-weight="600" fill="#6e6264">TOOLS</text>
<text x="400" y="0" font-size="13" font-weight="600" fill="#6e6264">CONTACT</text>

    </g>
    <!-- Get In Touch Button -->
    <rect x="1450" y="0" width="130" height="38" rx="10" fill="#2c2426"/>
    <text x="1515" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">GET IN TOUCH</text>
  </g>
  <line x1="160" y1="92" x2="1760" y2="92" stroke="#ebded7" stroke-width="1"/>


  <!-- Section Header -->
  <g transform="translate(160, 130)">
    <text x="0" y="0" class="kicker">CAREER JOURNEY</text>
    <text x="0" y="44" class="serif title">Experience you can rely on.</text>
    <text x="0" y="78" class="lead">A diverse background in customer service, team leadership, operations, coordination, and fast-paced professional environments.</text>
  </g>

  <!-- Experience Grid (2 Columns, matching .experience-list) -->
  <g transform="translate(160, 250)">
    <!-- Column 1 -->
    <!-- Card 1: Stranger Soccer -->
    <g transform="translate(0, 0)" filter="url(#card-shadow)">
      <rect width="780" height="230" rx="16" fill="#ffffff" stroke="#ebdad2e0" stroke-width="1"/>
      <g transform="translate(30, 30)">
        <text x="0" y="22" font-size="20" font-weight="700" fill="#2c2426">Stranger Soccer</text>
        <!-- CURRENT badge -->
        <rect x="175" y="4" width="85" height="22" rx="11" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
        <circle cx="188" cy="15" r="3" fill="#10b981"/>
        <text x="220" y="19" text-anchor="middle" font-size="10.5" font-weight="800" fill="#047857">CURRENT</text>
        
        <text x="0" y="48" font-size="13.5" font-weight="600" fill="#6e6264">Customer Service Representative · Current</text>

        <g transform="translate(10, 80)">
          <circle cx="0" cy="0" r="2.5" fill="#6e6264"/>
          <text x="14" y="4" font-size="14" fill="#6e6264">Support real-time bookings and cancellations.</text>
          
          <circle cx="0" cy="28" r="2.5" fill="#6e6264"/>
          <text x="14" y="32" font-size="14" fill="#6e6264">Send invitations and handle event bookings.</text>
          
          <circle cx="0" cy="56" r="2.5" fill="#6e6264"/>
          <text x="14" y="60" font-size="14" fill="#6e6264">Assist with rescheduling and customer concerns.</text>
        </g>
      </g>
    </g>

    <!-- Card 2: Finasa Agency -->
    <g transform="translate(0, 250)" filter="url(#card-shadow)">
      <rect width="780" height="230" rx="16" fill="#ffffff" stroke="#ebdad2e0" stroke-width="1"/>
      <g transform="translate(30, 30)">
        <text x="0" y="22" font-size="20" font-weight="700" fill="#2c2426">Finasa Agency</text>
        <text x="0" y="48" font-size="13.5" font-weight="600" fill="#6e6264">Chatter · Remote · 2025</text>

        <g transform="translate(10, 80)">
          <circle cx="0" cy="0" r="2.5" fill="#6e6264"/>
          <text x="14" y="4" font-size="14" fill="#6e6264">Worked effectively in fast-paced environments.</text>
          
          <circle cx="0" cy="28" r="2.5" fill="#6e6264"/>
          <text x="14" y="32" font-size="14" fill="#6e6264">Collaborated independently and with a team.</text>
          
          <circle cx="0" cy="56" r="2.5" fill="#6e6264"/>
          <text x="14" y="60" font-size="14" fill="#6e6264">Adapted quickly and communicated clearly.</text>
        </g>
      </g>
    </g>

    <!-- Card 3: Wanfang Technology Inc. -->
    <g transform="translate(0, 500)" filter="url(#card-shadow)">
      <rect width="780" height="230" rx="16" fill="#ffffff" stroke="#ebdad2e0" stroke-width="1"/>
      <g transform="translate(30, 30)">
        <text x="0" y="22" font-size="20" font-weight="700" fill="#2c2426">Wanfang Technology Inc.</text>
        <text x="0" y="48" font-size="13.5" font-weight="600" fill="#6e6264">Team Leader · 2017–2024</text>

        <g transform="translate(10, 80)">
          <circle cx="0" cy="0" r="2.5" fill="#6e6264"/>
          <text x="14" y="4" font-size="14" fill="#6e6264">Led agents and coordinated daily workflows.</text>
          
          <circle cx="0" cy="28" r="2.5" fill="#6e6264"/>
          <text x="14" y="32" font-size="14" fill="#6e6264">Delegated tasks and handled customer concerns.</text>
          
          <circle cx="0" cy="56" r="2.5" fill="#6e6264"/>
          <text x="14" y="60" font-size="14" fill="#6e6264">Resolved operational issues and trained new team members.</text>
        </g>
      </g>
    </g>

    <!-- Column 2 -->
    <!-- Card 4: Connect 88 Inc. -->
    <g transform="translate(820, 0)" filter="url(#card-shadow)">
      <rect width="780" height="230" rx="16" fill="#ffffff" stroke="#ebdad2e0" stroke-width="1"/>
      <g transform="translate(30, 30)">
        <text x="0" y="22" font-size="20" font-weight="700" fill="#2c2426">Connect 88 Inc.</text>
        <text x="0" y="48" font-size="13.5" font-weight="600" fill="#6e6264">CI · 2014–2017</text>

        <g transform="translate(10, 80)">
          <circle cx="0" cy="0" r="2.5" fill="#6e6264"/>
          <text x="14" y="4" font-size="14" fill="#6e6264">Verified records and information for accuracy.</text>
          
          <circle cx="0" cy="28" r="2.5" fill="#6e6264"/>
          <text x="14" y="32" font-size="14" fill="#6e6264">Monitored online systems and identified issues.</text>
          
          <circle cx="0" cy="56" r="2.5" fill="#6e6264"/>
          <text x="14" y="60" font-size="14" fill="#6e6264">Prepared reports and coordinated with technical teams.</text>
        </g>
      </g>
    </g>

    <!-- Card 5: Maxicuisine Inc. -->
    <g transform="translate(820, 250)" filter="url(#card-shadow)">
      <rect width="780" height="230" rx="16" fill="#ffffff" stroke="#ebdad2e0" stroke-width="1"/>
      <g transform="translate(30, 30)">
        <text x="0" y="22" font-size="20" font-weight="700" fill="#2c2426">Maxicuisine Inc.</text>
        <text x="0" y="48" font-size="13.5" font-weight="600" fill="#6e6264">Demi Chef · 2012–2014</text>

        <g transform="translate(10, 80)">
          <circle cx="0" cy="0" r="2.5" fill="#6e6264"/>
          <text x="14" y="4" font-size="14" fill="#6e6264">Supported daily operations and preparation.</text>
          
          <circle cx="0" cy="28" r="2.5" fill="#6e6264"/>
          <text x="14" y="32" font-size="14" fill="#6e6264">Managed inventory and supply ordering.</text>
          
          <circle cx="0" cy="56" r="2.5" fill="#6e6264"/>
          <text x="14" y="60" font-size="14" fill="#6e6264">Maintained safety standards and trained junior staff.</text>
        </g>
      </g>
    </g>

    <!-- Stat Summary Highlight in col 2 row 3 -->
    <g transform="translate(820, 500)">
      <rect width="780" height="230" rx="16" fill="#fbf0eb" stroke="#ebdcd4" stroke-width="1"/>
      <g transform="translate(40, 40)">
        <text x="0" y="24" font-size="18" font-weight="700" fill="#b87b70">✦ Proven 8+ Years Professional Experience</text>
        <text x="0" y="58" font-size="14" fill="#6e6264" width="700">Consistently demonstrating strong work ethic, high confidentiality, operational leadership, and rapid adaptability across corporate, remote, and customer-facing domains.</text>
        <g transform="translate(0, 110)">
          <rect width="200" height="38" rx="8" fill="#ffffff" stroke="#ebdcd4"/>
          <text x="100" y="23" text-anchor="middle" font-size="12" font-weight="700" fill="#2c2426">100% Reliable &amp; Discreet</text>
          
          <rect x="220" y="0" width="180" height="38" rx="8" fill="#ffffff" stroke="#ebdcd4"/>
          <text x="310" y="23" text-anchor="middle" font-size="12" font-weight="700" fill="#2c2426">Flexible Remote Hours</text>
        </g>
      </g>
    </g>
  </g>
</svg>
