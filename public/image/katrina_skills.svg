          <rect x="124" y="52" width="168" height="38" rx="19" fill="#fffffff2" stroke="#ebdad2d9"/>
          <text x="208" y="75" text-anchor="middle" font-size="13" font-weight="500" fill="#2c2426">Database Updating</text>

          <rect x="304" y="52" width="144" height="38" rx="19" fill="#fffffff2" stroke="#ebdad2d9"/>
          <text x="376" y="75" text-anchor="middle" font-size="13" font-weight="500" fill="#2c2426">Record Keeping</text>

          <rect x="460" y="52" width="194" height="38" rx="19" fill="#fffffff2" stroke="#ebdad2d9"/>
          <text x="557" y="75" text-anchor="middle" font-size="13" font-weight="500" fill="#2c2426">Information Verification</text>

          <!-- Row 3 -->
          <rect x="0" y="104" width="124" height="38" rx="19" fill="#fffffff2" stroke="#ebdad2d9"/>
          <text x="62" y="127" text-anchor="middle" font-size="13" font-weight="500" fill="#2c2426">Multitasking</text>
        </g>
      </g>
    </g>

    <!-- Card 4: Customer & Team Support -->
    <g transform="translate(820, 380)" filter="url(#card-shadow)">
      <rect width="780" height="340" rx="16" fill="#ffffff" stroke="#ebdad2d9" stroke-width="1"/>
      <g transform="translate(32, 34)">
        <text x="0" y="20" font-size="19" font-weight="700" fill="#2c2426">🤝   Customer &amp; Team Support</text>
        <g transform="translate(0, 50)">
          <!-- Row 1 -->
          <rect x="0" y="0" width="158" height="38" rx="19" fill="#fffffff2" stroke="#ebdad2d9"/>
          <text x="79" y="23" text-anchor="middle" font-size="13" font-weight="500" fill="#2c2426">Customer Support</text>

          <rect x="170" y="0" width="224" height="38" rx="19" fill="#fffffff2" stroke="#ebdad2d9"/>
          <text x="282" y="23" text-anchor="middle" font-size="13" font-weight="500" fill="#2c2426">Professional Communication</text>

          <rect x="406" y="0" width="168" height="38" rx="19" fill="#fffffff2" stroke="#ebdad2d9"/>
          <text x="490" y="23" text-anchor="middle" font-size="13" font-weight="500" fill="#2c2426">Task Coordination</text>

          <!-- Row 2 -->
          <rect x="0" y="52" width="162" height="38" rx="19" fill="#fffffff2" stroke="#ebdad2d9"/>
          <text x="81" y="75" text-anchor="middle" font-size="13" font-weight="500" fill="#2c2426">Time Management</text>

          <rect x="174" y="52" width="156" height="38" rx="19" fill="#fffffff2" stroke="#ebdad2d9"/>
          <text x="252" y="75" text-anchor="middle" font-size="13" font-weight="500" fill="#2c2426">Problem Solving</text>

          <rect x="342" y="52" width="164" height="38" rx="19" fill="#fffffff2" stroke="#ebdad2d9"/>
          <text x="424" y="75" text-anchor="middle" font-size="13" font-weight="500" fill="#2c2426">Attention to Detail</text>

          <rect x="518" y="52" width="170" height="38" rx="19" fill="#fffffff2" stroke="#ebdad2d9"/>
          <text x="603" y="75" text-anchor="middle" font-size="13" font-weight="500" fill="#2c2426">Team Collaboration</text>

          <!-- Row 3 -->
          <rect x="0" y="104" width="144" height="38" rx="19" fill="#fffffff2" stroke="#ebdad2d9"/>
          <text x="72" y="127" text-anchor="middle" font-size="13" font-weight="500" fill="#2c2426">Remote Support</text>
        </g>
      </g>
    </g>
  </g>
</svg>
