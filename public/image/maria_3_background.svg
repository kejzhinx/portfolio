<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&amp;display=swap');
      text { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
      .nav-text { font-size: 17px; font-weight: 600; fill: #334155; }
      .bg-title { font-size: 58px; font-weight: 900; fill: #1a365d; letter-spacing: -0.025em; text-anchor: middle; }
      .bg-subtitle { font-size: 21px; fill: #475569; font-weight: 500; text-anchor: middle; }
    </style>
    <filter id="clinic-card-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#0e6ba8" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="#f8fafc"/>

  <!-- Top Navigation Bar -->
  <g transform="translate(140, 42)">
    <g transform="translate(0, 4)">
      <path d="M22 6 C16 0 6 2 2 12 C-4 26 12 40 22 50 C32 40 48 26 42 12 C38 2 28 0 22 6 Z" fill="#1a365d" transform="scale(0.9)"/>
      <path d="M5 21 L12 21 L16 11 L22 31 L27 16 L31 24 L35 21 L40 21" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="scale(0.9)"/>
    </g>

    <g transform="translate(680, 26)">
      <text x="0" y="0" class="nav-text">Home</text>
      <text x="110" y="0" class="nav-text">About</text>
      <text x="210" y="0" class="nav-text" fill="#0e6ba8" font-weight="700">Services</text>
      <text x="325" y="0" class="nav-text">Contact</text>
    </g>

    <rect x="1420" y="4" width="220" height="50" rx="25" fill="#0e6ba8"/>
    <text x="1530" y="35" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff" letter-spacing="0.05em">LET'S WORK TOGETHER</text>
  </g>

  <!-- Section Header with Heartbeat Icon -->
  <g transform="translate(960, 150)">
    <!-- Lifeline Heartbeat Pulse Graphics -->
    <path d="M-220 0 L-60 0 L-40 -26 L-20 26 L0 -10 L10 0" stroke="#0e6ba8" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Heart in Center -->
    <circle cx="0" cy="0" r="18" fill="#0e6ba8"/>
    <path d="M-8 -3 C-12 -9 -5 -13 0 -6 C5 -13 12 -9 8 -3 C5 3 0 9 0 9 C0 9 -5 3 -8 -3 Z" fill="#ffffff" transform="scale(1.2) translate(-0.5, -1)"/>

    <path d="M-10 0 L0 -10 L20 26 L40 -26 L60 0 L220 0" stroke="#0e6ba8" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Heading -->
    <text x="0" y="75" class="bg-title">Professional Background</text>
    <text x="0" y="120" class="bg-subtitle">Over 4 Years of Supporting Healthcare Providers</text>
  </g>

  <!-- 8 Cards Grid (4 columns x 2 rows) matching screenshot exactly -->
  <g transform="translate(180, 360)">
    
    <!-- Row 1: 4 Cards -->
    <!-- Card 1: VISUAL PROCESSING -->
    <g transform="translate(0, 0)" filter="url(#clinic-card-shadow)">
      <rect width="365" height="190" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <g transform="translate(182, 75)">
        <text x="0" y="0" text-anchor="middle" font-size="24" font-weight="900" fill="#7e22ce" letter-spacing="0.08em">VISUAL</text>
        <text x="0" y="24" text-anchor="middle" font-size="14" font-weight="800" fill="#581c87" letter-spacing="0.16em">PROCESSING</text>
        <text x="0" y="44" text-anchor="middle" font-size="10" font-weight="700" fill="#64748b" letter-spacing="0.1em">OPTOMETRY</text>
      </g>
    </g>

    <!-- Card 2: Gunz DENTAL -->
    <g transform="translate(395, 0)" filter="url(#clinic-card-shadow)">
      <rect width="365" height="190" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <g transform="translate(182, 70)">
        <text x="0" y="0" text-anchor="middle" font-size="26" font-style="italic" font-weight="900" fill="#1e293b">Gunz</text>
        <text x="0" y="28" text-anchor="middle" font-size="17" font-weight="800" fill="#0284c7" letter-spacing="0.14em">DENTAL</text>
        <text x="0" y="48" text-anchor="middle" font-size="8" font-weight="600" fill="#94a3b8" letter-spacing="0.06em">THE PEOPLE BEHIND THE PRODUCTS YOU TRUST</text>
      </g>
    </g>

    <!-- Card 3: QuickMD -->
    <g transform="translate(790, 0)" filter="url(#clinic-card-shadow)">
      <rect width="365" height="190" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <g transform="translate(182, 105)">
        <!-- QuickMD Search Icon -->
        <circle cx="-75" cy="-12" r="16" fill="none" stroke="#0284c7" stroke-width="3"/>
        <line x1="-63" y1="0" x2="-55" y2="8" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>
        <text x="5" y="0" text-anchor="middle" font-size="28" font-weight="900" fill="#0f172a">Quick<tspan fill="#0284c7">MD</tspan></text>
      </g>
    </g>

    <!-- Card 4: A Step Above -->
    <g transform="translate(1185, 0)" filter="url(#clinic-card-shadow)">
      <rect width="365" height="190" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <g transform="translate(182, 75)">
        <text x="0" y="0" text-anchor="middle" font-size="21" font-style="italic" font-weight="800" fill="#047857">A Step Above</text>
        <text x="0" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">Health Management</text>
        <text x="0" y="42" text-anchor="middle" font-size="9" font-weight="600" fill="#64748b">Pediatric Billing and Consulting</text>
      </g>
    </g>

    <!-- Row 2: 4 Cards -->
    <!-- Card 5: Siyan Clinical Corporation -->
    <g transform="translate(0, 220)" filter="url(#clinic-card-shadow)">
      <rect width="365" height="190" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <g transform="translate(182, 105)">
        <text x="0" y="0" text-anchor="middle" font-size="19" font-weight="800" fill="#065f46">Siyan Clinical Corporation</text>
      </g>
    </g>

    <!-- Card 6: FLOURISH MINDSET -->
    <g transform="translate(395, 220)" filter="url(#clinic-card-shadow)">
      <rect width="365" height="190" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <g transform="translate(182, 85)">
        <text x="0" y="0" text-anchor="middle" font-size="18" font-weight="900" fill="#064e3b" letter-spacing="0.08em">FLOURISH MINDSET</text>
        <text x="0" y="26" text-anchor="middle" font-size="10" font-weight="700" fill="#475569" letter-spacing="0.06em">MARRIAGE AND FAMILY THERAPY</text>
      </g>
    </g>

    <!-- Card 7: MEDENS HEALTH -->
    <g transform="translate(790, 220)" filter="url(#clinic-card-shadow)">
      <rect width="365" height="190" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <g transform="translate(182, 85)">
        <text x="0" y="0" text-anchor="middle" font-size="20" font-weight="900" fill="#1e293b" letter-spacing="0.12em">MEDENS</text>
        <text x="0" y="26" text-anchor="middle" font-size="16" font-weight="900" fill="#ea580c" letter-spacing="0.16em">HEALTH</text>
      </g>
    </g>

    <!-- Card 8: LA Peace of Mind -->
    <g transform="translate(1185, 220)" filter="url(#clinic-card-shadow)">
      <rect width="365" height="190" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <g transform="translate(182, 85)">
        <text x="0" y="0" text-anchor="middle" font-size="19" font-weight="800" fill="#064e3b">LA Peace of Mind</text>
        <text x="0" y="24" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">Counseling Services, Inc.</text>
      </g>
    </g>

  </g>

  <!-- Centered Button: LET'S WORK TOGETHER -->
  <g transform="translate(960, 890)">
    <rect x="-150" y="0" width="300" height="64" rx="32" fill="#0e6ba8" filter="url(#clinic-card-shadow)"/>
    <text x="0" y="38" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff" letter-spacing="0.08em">LET'S WORK TOGETHER</text>
  </g>
</svg>
