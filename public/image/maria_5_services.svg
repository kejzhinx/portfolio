<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&amp;display=swap');
      text { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
      .nav-text { font-size: 17px; font-weight: 600; fill: #334155; }
      .services-h1 { font-size: 58px; font-weight: 900; fill: #1a365d; letter-spacing: -0.025em; text-anchor: middle; }
      .services-p { font-size: 21px; fill: #475569; font-weight: 400; text-anchor: middle; }
      .svc-card-title { font-size: 22px; font-weight: 800; fill: #1a365d; text-anchor: middle; }
      .svc-card-desc { font-size: 15px; fill: #475569; font-weight: 400; line-height: 1.5; text-anchor: middle; }
    </style>
    <filter id="svc-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0e6ba8" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="#ffffff"/>

  <!-- Top Navigation Bar -->
  <g transform="translate(140, 42)">
    <g transform="translate(0, 4)">
      <path d="M22 6 C16 0 6 2 2 12 C-4 26 12 40 22 50 C32 40 48 26 42 12 C38 2 28 0 22 6 Z" fill="#1a365d" transform="scale(0.9)"/>
      <path d="M5 21 L12 21 L16 11 L22 31 L27 16 L31 24 L35 21 L40 21" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="scale(0.9)"/>
    </g>

    <g transform="translate(680, 26)">
      <text x="0" y="0" class="nav-text">Home</text>
      <text x="110" y="0" class="nav-text">About</text>
      <text x="210" y="0" class="nav-text" fill="#0e6ba8" font-weight="700">Services</text>
      <text x="325" y="0" class="nav-text">Contact</text>
    </g>

    <rect x="1420" y="4" width="220" height="50" rx="25" fill="#0e6ba8"/>
    <text x="1530" y="35" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff" letter-spacing="0.05em">LET'S WORK TOGETHER</text>
  </g>

  <!-- Section Header -->
  <g transform="translate(960, 150)">
    <text x="0" y="40" class="services-h1">Services I Provide</text>
    <text x="0" y="85" class="services-p">From billing and coding to scheduling, I offer reliable, comprehensive support for clinics and</text>
    <text x="0" y="115" class="services-p">practitioners.</text>
  </g>

  <!-- 7 Light-Blue Cards Grid matching screenshot -->
  <g transform="translate(120, 310)">
    
    <!-- Row 1: 4 Cards -->
    <!-- Card 1: Insurance Verification & Claims -->
    <g transform="translate(0, 0)">
      <rect width="395" height="320" rx="30" fill="#e0f2fe"/>
      <g transform="translate(197, 85)">
        <!-- Document Check Icon -->
        <circle cx="0" cy="0" r="32" fill="#ffffff" filter="url(#svc-shadow)"/>
        <rect x="-12" y="-16" width="24" height="32" rx="4" fill="none" stroke="#0284c7" stroke-width="2.5"/>
        <path d="M-6 0 L-2 4 L8 -6" stroke="#0284c7" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        
        <text x="0" y="75" class="svc-card-title">Insurance Verification &amp;</text>
        <text x="0" y="102" class="svc-card-title">Claims</text>
        
        <text x="0" y="145" class="svc-card-desc">Real-time 270/271 eligibility and prior auth</text>
        <text x="0" y="170" class="svc-card-desc">processing.</text>
      </g>
    </g>

    <!-- Card 2: Patient Intake & Scheduling -->
    <g transform="translate(425, 0)">
      <rect width="395" height="320" rx="30" fill="#e0f2fe"/>
      <g transform="translate(197, 85)">
        <!-- Calendar Icon -->
        <circle cx="0" cy="0" r="32" fill="#ffffff" filter="url(#svc-shadow)"/>
        <rect x="-15" y="-13" width="30" height="26" rx="4" fill="none" stroke="#0284c7" stroke-width="2.5"/>
        <line x1="-15" y1="-5" x2="15" y2="-5" stroke="#0284c7" stroke-width="2"/>
        <circle cx="-5" cy="3" r="2" fill="#0284c7"/>
        <circle cx="5" cy="3" r="2" fill="#0284c7"/>
        
        <text x="0" y="85" class="svc-card-title">Patient Intake &amp; Scheduling</text>
        <text x="0" y="145" class="svc-card-desc">Managing appointments and calendar</text>
        <text x="0" y="170" class="svc-card-desc">coordination.</text>
      </g>
    </g>

    <!-- Card 3: Small Inbox Management -->
    <g transform="translate(850, 0)">
      <rect width="395" height="320" rx="30" fill="#e0f2fe"/>
      <g transform="translate(197, 85)">
        <!-- Mail Icon -->
        <circle cx="0" cy="0" r="32" fill="#ffffff" filter="url(#svc-shadow)"/>
        <rect x="-16" y="-11" width="32" height="22" rx="4" fill="none" stroke="#0284c7" stroke-width="2.5"/>
        <path d="M-14 -9 L0 3 L14 -9" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
        
        <text x="0" y="85" class="svc-card-title">Small Inbox Management</text>
        <text x="0" y="145" class="svc-card-desc">Handling secure patient portal messages</text>
        <text x="0" y="170" class="svc-card-desc">and e-faxes.</text>
      </g>
    </g>

    <!-- Card 4: Medical Reception -->
    <g transform="translate(1275, 0)">
      <rect width="395" height="320" rx="30" fill="#e0f2fe"/>
      <g transform="translate(197, 85)">
        <!-- Stethoscope Icon -->
        <circle cx="0" cy="0" r="32" fill="#ffffff" filter="url(#svc-shadow)"/>
        <path d="M-10 -12 L-10 0 C-10 8 10 8 10 0 L10 -12" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="0" cy="14" r="5" fill="none" stroke="#0284c7" stroke-width="2.5"/>
        
        <text x="0" y="85" class="svc-card-title">Medical Reception</text>
        <text x="0" y="145" class="svc-card-desc">Front desk virtual phone triage and</text>
        <text x="0" y="170" class="svc-card-desc">greeting.</text>
      </g>
    </g>

    <!-- Row 2: 3 Cards Centered -->
    <!-- Card 5: Inbound & Outbound Communication -->
    <g transform="translate(0, 350)">
      <rect width="395" height="320" rx="30" fill="#e0f2fe"/>
      <g transform="translate(197, 85)">
        <!-- Phone Call Icon -->
        <circle cx="0" cy="0" r="32" fill="#ffffff" filter="url(#svc-shadow)"/>
        <path d="M-7 -10 C-12 -5 -12 7 -4 11 C2 15 10 9 7 4 L5 4 L4 6 C-1 4 -3 1 -2 -2 L0 -4 Z" fill="#0284c7" transform="scale(1.2)"/>
        
        <text x="0" y="75" class="svc-card-title">Inbound &amp; Outbound</text>
        <text x="0" y="102" class="svc-card-title">Communication</text>
        
        <text x="0" y="145" class="svc-card-desc">Nextiva VoIP calling with patients and</text>
        <text x="0" y="170" class="svc-card-desc">insurance payers.</text>
      </g>
    </g>

    <!-- Card 6: Virtual Support for Providers -->
    <g transform="translate(425, 350)">
      <rect width="395" height="320" rx="30" fill="#e0f2fe"/>
      <g transform="translate(197, 85)">
        <!-- Users Icon -->
        <circle cx="0" cy="0" r="32" fill="#ffffff" filter="url(#svc-shadow)"/>
        <circle cx="-6" cy="-4" r="6" fill="none" stroke="#0284c7" stroke-width="2.5"/>
        <path d="M-15 12 C-15 5 -2 5 -2 12" fill="none" stroke="#0284c7" stroke-width="2.5"/>
        <circle cx="8" cy="-2" r="5" fill="none" stroke="#0284c7" stroke-width="2"/>
        <path d="M3 12 C3 7 15 7 15 12" fill="none" stroke="#0284c7" stroke-width="2"/>
        
        <text x="0" y="85" class="svc-card-title">Virtual Support for Providers</text>
        <text x="0" y="145" class="svc-card-desc">Dedicated administrative support for ENT</text>
        <text x="0" y="170" class="svc-card-desc">&amp; allergy.</text>
      </g>
    </g>

    <!-- Card 7: Medical Coding & Account Receivables -->
    <g transform="translate(850, 350)">
      <rect width="395" height="320" rx="30" fill="#e0f2fe"/>
      <g transform="translate(197, 85)">
        <!-- Code / Binary Icon -->
        <circle cx="0" cy="0" r="32" fill="#ffffff" filter="url(#svc-shadow)"/>
        <rect x="-14" y="-12" width="28" height="24" rx="4" fill="none" stroke="#0284c7" stroke-width="2.5"/>
        <text x="-4" y="-1" font-size="9" font-weight="900" fill="#0284c7">01</text>
        <text x="-4" y="8" font-size="9" font-weight="900" fill="#0284c7">10</text>
        
        <text x="0" y="75" class="svc-card-title">Medical Coding &amp; Account</text>
        <text x="0" y="102" class="svc-card-title">Receivables</text>
        
        <text x="0" y="145" class="svc-card-desc">CPT, ICD-10 coding accuracy and follow-</text>
        <text x="0" y="170" class="svc-card-desc">ups.</text>
      </g>
    </g>

  </g>
</svg>
