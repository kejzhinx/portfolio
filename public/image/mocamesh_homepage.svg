<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <!-- Browser Window Shadow -->
    <filter id="winShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#020617" flood-opacity="0.6" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>

    <!-- Chrome Metallic Blue for the Real Logo -->
    <linearGradient id="metalBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="30%" stop-color="#2563eb" />
      <stop offset="70%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
  </defs>

  <!-- Browser Frame Wrapper -->
  <g filter="url(#winShadow)">
    <rect width="1000" height="700" rx="12" fill="#b0e0e6" stroke="#94a3b8" stroke-width="1" />

    <!-- Browser Header Bar -->
    <rect width="1000" height="46" rx="12" fill="#1e293b" />
    <rect y="36" width="1000" height="10" fill="#1e293b" />
    <line x1="0" y1="46" x2="1000" y2="46" stroke="#334155" stroke-width="1" />

    <!-- Window Buttons -->
    <circle cx="24" cy="23" r="5.5" fill="#ef4444" />
    <circle cx="42" cy="23" r="5.5" fill="#f59e0b" />
    <circle cx="60" cy="23" r="5.5" fill="#10b981" />

    <!-- Address Bar -->
    <rect x="260" y="10" width="480" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="500" y="27" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" text-anchor="middle">
      localhost/Mocamesh/index.php
    </text>
  </g>

  <!-- Real Webpage Body (Powderblue #B0E0E6) -->
  <g transform="translate(0, 46)">
    <!-- Container -->
    <g transform="translate(260, 20)">

      <!-- Real Mocamesh Logo from repo (3D Monogram & DESIGN) -->
      <g transform="translate(240, 25) scale(0.65)">
        <!-- Vertical Bar -->
        <path d="M -16 -80 L 16 -80 L 16 0 L -16 0 Z" fill="url(#metalBlue)" stroke="#60a5fa" stroke-width="1.5" />
        <path d="M -16 -80 L 16 -80 L 10 -74 L -10 -74 Z" fill="#93c5fd" />
        <!-- Cross Wing -->
        <path d="M -75 0 L -16 0 L -16 26 L -55 26 L -75 12 Z" fill="url(#metalBlue)" stroke="#60a5fa" stroke-width="1.5" />
        <!-- Polygon Loop -->
        <path d="M -16 0 L 68 0 L 108 52 L 68 108 L -16 108 Z" fill="url(#metalBlue)" stroke="#60a5fa" stroke-width="1.5" />
        <path d="M 12 24 L 54 24 L 78 52 L 54 82 L 12 82 Z" fill="#0b1329" stroke="#1d4ed8" stroke-width="1.5" />
        <!-- Bevel Facet Accents -->
        <path d="M -16 0 L 68 0 L 54 24 L 12 24 L -16 24 Z" fill="#93c5fd" opacity="0.8" />
        <path d="M 68 0 L 108 52 L 78 52 L 54 24 Z" fill="#3b82f6" opacity="0.75" />
        <path d="M 108 52 L 68 108 L 54 82 L 78 52 Z" fill="#1e3a8a" opacity="0.85" />
        <path d="M 68 108 L -16 108 L -16 82 L 12 82 L 54 82 Z" fill="#0f172a" opacity="0.9" />

        <!-- DESIGN Text -->
        <text x="16" y="148" fill="#1d4ed8" stroke="#60a5fa" stroke-width="1.2" font-family="'Arial Black', Impact, sans-serif" font-size="34" font-weight="900" letter-spacing="9" text-anchor="middle">
          DESIGN
        </text>
      </g>

      <!-- Paystack Voucher Form Card (Matches index.php & style.css) -->
      <g transform="translate(0, 165)" filter="url(#cardShadow)">
        <rect width="480" height="425" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />

        <!-- Form Header Badge -->
        <rect x="24" y="22" width="130" height="24" rx="4" fill="#00c3f7" opacity="0.15" />
        <text x="89" y="38" fill="#0284c7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.5">
          PAYSTACK GATEWAY
        </text>

        <!-- Form Title -->
        <text x="24" y="74" fill="#1e293b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800">
          WiFi Voucher Portal
        </text>
        <text x="24" y="94" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
          Purchase instant high-speed hotspot voucher access
        </text>

        <!-- Field 1: Email Address -->
        <g transform="translate(24, 115)">
          <text x="0" y="0" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700">
            Email Address
          </text>
          <rect y="8" width="432" height="42" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
          <text x="14" y="34" fill="#334155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">
            customer@example.com
          </text>
        </g>

        <!-- Field 2: Phone Number -->
        <g transform="translate(24, 185)">
          <text x="0" y="0" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700">
            Phone Number:
          </text>
          <rect y="8" width="432" height="42" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
          <text x="14" y="34" fill="#334155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">
            09123456789
          </text>
        </g>

        <!-- Field 3: Amount Select -->
        <g transform="translate(24, 255)">
          <text x="0" y="0" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700">
            Amount
          </text>
          <rect y="8" width="432" height="42" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
          <text x="14" y="34" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">
            100 for 10GB Data Access
          </text>
          <!-- Select Chevron -->
          <path d="M 426 27 L 434 35 L 442 27" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </g>

        <!-- Submit Button: button[type="submit"] background-color: #008803 -->
        <g transform="translate(24, 342)">
          <rect width="432" height="46" rx="4" fill="#008803" />
          <text x="216" y="28" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="700" letter-spacing="1" text-anchor="middle">
            GET VOUCHER
          </text>
        </g>

        <!-- Security / API Info Footer -->
        <g transform="translate(24, 404)">
          <circle cx="5" cy="5" r="3" fill="#10b981" />
          <text x="15" y="8.5" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">
            Secured via Paystack Inline JS • Instant Webhook &amp; DB Verification
          </text>
        </g>
      </g>
    </g>
  </g>
</svg>
