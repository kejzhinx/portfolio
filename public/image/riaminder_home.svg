<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 1080" width="540" height="1080">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Playfair+Display:ital,wght@1,600&amp;display=swap');
      text { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
      .serif { font-family: 'Playfair Display', Georgia, serif; }
    </style>
    <linearGradient id="hero-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff7a50"/>
      <stop offset="100%" stop-color="#ffab76"/>
    </linearGradient>
    <filter id="fab-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#ff3366" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="540" height="1080" rx="40" fill="#f8faff"/>

  <!-- Top Header Profile -->
  <g transform="translate(36, 70)">
    <rect width="56" height="56" rx="18" fill="#edf3ff" stroke="#dbe7ff"/>
    <circle cx="28" cy="22" r="8" fill="#94a3b8"/>
    <path d="M16 42 Q28 32 40 42" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>

    <g transform="translate(76, 12)">
      <text x="0" y="16" font-size="22" font-weight="800" fill="#0f172a">Hi, Guest 👋</text>
      <text x="0" y="38" font-size="14" fill="#64748b">Focus on what matters.</text>
    </g>
  </g>

  <!-- UPCOMING EVENT BANNER (Her 35th Birthday) matching Image 3 -->
  <g transform="translate(36, 185)">
    <rect width="468" height="295" rx="32" fill="url(#hero-grad)"/>

    <!-- Pill: UPCOMING EVENT -->
    <g transform="translate(24, 24)">
      <rect width="220" height="46" rx="23" fill="#ffffff"/>
      <circle cx="24" cy="23" r="14" fill="#ff3366"/>
      <text x="24" y="28" text-anchor="middle" font-size="14" fill="#ffffff">🎁</text>
      <text x="50" y="28" font-size="12" font-weight="800" fill="#ff3366" letter-spacing="1">UPCOMING EVENT</text>
    </g>

    <!-- Event Title & Copy -->
    <g transform="translate(24, 115)">
      <text x="0" y="24" class="serif" font-size="36" font-style="italic" font-weight="600" fill="#ffffff">Her 35th Birthday</text>
      <text x="0" y="60" font-size="11.5" font-weight="800" fill="#ffffff" letter-spacing="1">WISHING YOU A DAY FILLED WITH JOY AND CELEBRATION!</text>
    </g>

    <!-- Birthday Cake Graphic (Right) -->
    <g transform="translate(310, 110)">
      <!-- Red Balloon -->
      <circle cx="85" cy="20" r="30" fill="#ea3838"/>
      <path d="M85 50 Q75 80 80 110" fill="none" stroke="#ffffff" stroke-width="1.5"/>

      <!-- Cake Base -->
      <ellipse cx="60" cy="115" rx="65" ry="25" fill="#fcd34d"/>
      <rect x="-5" y="80" width="130" height="35" fill="#fff7ed"/>
      <ellipse cx="60" cy="80" rx="65" ry="22" fill="#ffedd5"/>
      <!-- Strawberries & Candles -->
      <circle cx="20" cy="80" r="8" fill="#ef4444"/>
      <circle cx="60" cy="85" r="9" fill="#ef4444"/>
      <circle cx="100" cy="80" r="8" fill="#ef4444"/>
      <!-- Candles -->
      <rect x="40" y="50" width="4" height="25" fill="#fbbf24"/>
      <rect x="80" y="50" width="4" height="25" fill="#ec4899"/>
      <circle cx="42" cy="46" r="3" fill="#f59e0b"/>
      <circle cx="82" cy="46" r="3" fill="#f59e0b"/>
    </g>

    <!-- Countdown Pills (29 DAYS | 16 HRS | 28 MIN) -->
    <g transform="translate(24, 205)">
      <!-- 29 DAYS -->
      <rect width="76" height="74" rx="20" fill="#ffffff"/>
      <text x="38" y="38" text-anchor="middle" font-size="24" font-weight="800" fill="#ff3366">29</text>
      <text x="38" y="58" text-anchor="middle" font-size="10.5" font-weight="800" fill="#94a3b8" letter-spacing="1">DAYS</text>

      <!-- 16 HRS -->
      <g transform="translate(86, 0)">
        <rect width="76" height="74" rx="20" fill="#ffffff"/>
        <text x="38" y="38" text-anchor="middle" font-size="24" font-weight="800" fill="#ff3366">16</text>
        <text x="38" y="58" text-anchor="middle" font-size="10.5" font-weight="800" fill="#94a3b8" letter-spacing="1">HRS</text>
      </g>

      <!-- 28 MIN -->
      <g transform="translate(172, 0)">
        <rect width="76" height="74" rx="20" fill="#ffffff"/>
        <text x="38" y="38" text-anchor="middle" font-size="24" font-weight="800" fill="#ff3366">28</text>
        <text x="38" y="58" text-anchor="middle" font-size="10.5" font-weight="800" fill="#94a3b8" letter-spacing="1">MIN</text>
      </g>
    </g>
  </g>

  <!-- CALENDAR SECTION: OCTOBER 2026 matching Image 3 -->
  <g transform="translate(36, 520)">
    <rect width="468" height="340" rx="32" fill="#ffffff" stroke="#f1f5f9"/>

    <!-- Calendar Month Header -->
    <g transform="translate(24, 32)">
      <text x="0" y="20" font-size="22" font-weight="900" fill="#0f172a">OCTOBER <tspan fill="#ff3366">2026</tspan></text>
      <g transform="translate(360, 4)">
        <circle cx="14" cy="14" r="14" fill="#f8fafc"/>
        <text x="14" y="19" text-anchor="middle" font-size="14" fill="#94a3b8">‹</text>
        <circle cx="48" cy="14" r="14" fill="#f8fafc"/>
        <text x="48" y="19" text-anchor="middle" font-size="14" fill="#94a3b8">›</text>
      </g>
    </g>

    <!-- Days of Week Header -->
    <g transform="translate(24, 90)">
      <text x="20" y="0" text-anchor="middle" font-size="13" font-weight="800" fill="#64748b">S</text>
      <text x="80" y="0" text-anchor="middle" font-size="13" font-weight="800" fill="#64748b">M</text>
      <text x="140" y="0" text-anchor="middle" font-size="13" font-weight="800" fill="#64748b">T</text>
      <text x="200" y="0" text-anchor="middle" font-size="13" font-weight="800" fill="#64748b">W</text>
      <text x="260" y="0" text-anchor="middle" font-size="13" font-weight="800" fill="#64748b">T</text>
      <text x="320" y="0" text-anchor="middle" font-size="13" font-weight="800" fill="#64748b">F</text>
      <text x="380" y="0" text-anchor="middle" font-size="13" font-weight="800" fill="#64748b">S</text>

      <!-- Row 1: 27 28 29 30 1 2 3 -->
      <g transform="translate(0, 50)">
        <text x="20" y="0" text-anchor="middle" font-size="15" font-weight="600" fill="#cbd5e1">27</text>
        <text x="80" y="0" text-anchor="middle" font-size="15" font-weight="600" fill="#cbd5e1">28</text>
        <text x="140" y="0" text-anchor="middle" font-size="15" font-weight="600" fill="#cbd5e1">29</text>
        <!-- Highlighted 30 -->
        <circle cx="200" cy="-6" r="24" fill="#ffe4e6"/>
        <text x="200" y="0" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">30</text>
        <text x="260" y="0" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">1</text>
        <text x="320" y="0" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">2</text>
        <text x="380" y="0" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">3</text>
      </g>

      <!-- Row 2: 4 5 6 7 8 9 10 -->
      <g transform="translate(0, 110)">
        <text x="20" y="0" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">4</text>
        <text x="80" y="0" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">5</text>
        <text x="140" y="0" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">6</text>
        <text x="200" y="0" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">7</text>
        <text x="260" y="0" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">8</text>
        <text x="320" y="0" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">9</text>
        <text x="380" y="0" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">10</text>
      </g>

      <!-- Row 3: 11 12 13 14 15 16 -->
      <g transform="translate(0, 170)">
        <text x="20" y="0" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">11</text>
        <text x="80" y="0" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">12</text>
        <text x="140" y="0" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">13</text>
        <text x="200" y="0" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">14</text>
        <text x="260" y="0" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">15</text>
        <text x="320" y="0" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">16</text>
      </g>
    </g>

    <!-- Pink Floating (+) Action Button -->
    <g transform="translate(380, 245)" filter="url(#fab-shadow)">
      <circle cx="34" cy="34" r="34" fill="#ff3366"/>
      <text x="34" y="44" text-anchor="middle" font-size="34" font-weight="600" fill="#ffffff">+</text>
    </g>
  </g>

  <!-- Bottom Navigation Bar matching Image 3 -->
  <g transform="translate(0, 960)">
    <rect width="540" height="120" fill="#ffffff" stroke="#f1f5f9"/>

    <!-- HOME (Active) -->
    <g transform="translate(70, 20)">
      <rect x="-26" y="0" width="52" height="52" rx="18" fill="#ff3366"/>
      <path d="M-10 26 L0 16 L10 26 L10 34 L-10 34 Z" fill="#ffffff"/>
      <text x="0" y="70" text-anchor="middle" font-size="12" font-weight="800" fill="#ff3366">HOME</text>
    </g>

    <!-- NOTES -->
    <g transform="translate(195, 20)">
      <rect x="-24" y="0" width="48" height="48" rx="16" fill="#f8fafc"/>
      <rect x="-8" y="14" width="16" height="20" rx="2" fill="none" stroke="#94a3b8" stroke-width="2"/>
      <text x="0" y="70" text-anchor="middle" font-size="12" font-weight="700" fill="#94a3b8">NOTES</text>
    </g>

    <!-- ASSISTANT -->
    <g transform="translate(325, 20)">
      <rect x="-24" y="0" width="48" height="48" rx="16" fill="#f8fafc"/>
      <rect x="-10" y="18" width="20" height="14" rx="3" fill="none" stroke="#94a3b8" stroke-width="2"/>
      <text x="0" y="70" text-anchor="middle" font-size="12" font-weight="700" fill="#94a3b8">ASSISTANT</text>
    </g>

    <!-- SETTINGS -->
    <g transform="translate(450, 20)">
      <rect x="-24" y="0" width="48" height="48" rx="16" fill="#f8fafc"/>
      <circle cx="0" cy="24" r="8" fill="none" stroke="#94a3b8" stroke-width="2"/>
      <text x="0" y="70" text-anchor="middle" font-size="12" font-weight="700" fill="#94a3b8">SETTINGS</text>
    </g>
  </g>
</svg>