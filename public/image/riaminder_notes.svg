<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 1080" width="540" height="1080">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap');
      text { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
    </style>
  </defs>

  <rect width="540" height="1080" rx="40" fill="#f8faff"/>

  <g transform="translate(36, 70)">
    <rect width="56" height="56" rx="18" fill="#edf3ff" stroke="#dbe7ff"/>
    <circle cx="28" cy="22" r="8" fill="#94a3b8"/>
    <path d="M16 42 Q28 32 40 42" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>

    <g transform="translate(76, 12)">
      <text x="0" y="16" font-size="22" font-weight="800" fill="#0f172a">Hi, Guest 👋</text>
      <text x="0" y="38" font-size="14" fill="#64748b">Focus on what matters.</text>
    </g>
  </g>

  <!-- NOTES Header & Purple (+) Button -->
  <g transform="translate(36, 180)">
    <div>
      <text x="0" y="36" font-size="40" font-weight="900" fill="#0f172a" letter-spacing="-0.5">NOTES</text>
      <text x="0" y="68" font-size="12" font-weight="800" fill="#64748b" letter-spacing="1.5">1 THOUGHTS CAPTURED  <tspan fill="#a855f7">●</tspan></text>
    </div>

    <!-- Purple (+) button -->
    <g transform="translate(400, 10)">
      <rect width="64" height="64" rx="22" fill="#6366f1"/>
      <text x="32" y="42" text-anchor="middle" font-size="34" font-weight="600" fill="#ffffff">+</text>
    </g>
  </g>

  <!-- Search Input Bar -->
  <g transform="translate(36, 290)">
    <rect width="468" height="68" rx="26" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="24" y="42" font-size="18" fill="#94a3b8">🔍</text>
    <text x="64" y="42" font-size="16" fill="#94a3b8">Find a thought...</text>
    <text x="430" y="42" font-size="18" fill="#94a3b8">⚙</text>
  </g>

  <!-- Note Card: "test" with Context Popover Menu -->
  <g transform="translate(36, 390)">
    <rect width="468" height="170" rx="30" fill="#ffffff" stroke="#e2e8f0"/>

    <g transform="translate(24, 24)">
      <!-- Note icon -->
      <rect width="48" height="48" rx="14" fill="#eff6ff"/>
      <rect x="14" y="14" width="20" height="20" rx="2" fill="none" stroke="#3b82f6" stroke-width="2"/>

      <text x="0" y="85" font-size="24" font-weight="800" fill="#0f172a">test</text>
      <rect y="105" width="135" height="30" rx="12" fill="#f1f5f9"/>
      <text x="14" y="125" font-size="11" font-weight="800" fill="#64748b">📅 SEP 30, 2026</text>

      <!-- 3 dots -->
      <text x="410" y="32" font-size="24" fill="#0f172a">⋮</text>
    </g>

    <!-- Popover Menu matching Image 4 -->
    <g transform="translate(230, 75)">
      <rect width="210" height="110" rx="18" fill="#ffffff" stroke="#e2e8f0" filter="url(#fab-shadow)"/>
      <g transform="translate(20, 36)">
        <text x="0" y="0" font-size="15" fill="#334155">📌</text>
        <text x="32" y="0" font-size="15" font-weight="700" fill="#1e293b">Pin</text>
      </g>
      <line x1="16" y1="58" x2="194" y2="58" stroke="#f1f5f9"/>
      <g transform="translate(20, 85)">
        <text x="0" y="0" font-size="15" fill="#ef4444">🗑</text>
        <text x="32" y="0" font-size="15" font-weight="700" fill="#ef4444">Delete</text>
      </g>
    </g>
  </g>

  <!-- Bottom Nav -->
  <g transform="translate(0, 960)">
    <rect width="540" height="120" fill="#ffffff" stroke="#f1f5f9"/>
    <g transform="translate(70, 20)"><text x="0" y="70" text-anchor="middle" font-size="12" font-weight="700" fill="#94a3b8">HOME</text></g>
    <!-- NOTES (Active) -->
    <g transform="translate(195, 20)">
      <rect x="-26" y="0" width="52" height="52" rx="18" fill="#ff3366"/>
      <rect x="-8" y="16" width="16" height="20" rx="2" fill="none" stroke="#ffffff" stroke-width="2"/>
      <text x="0" y="70" text-anchor="middle" font-size="12" font-weight="800" fill="#ff3366">NOTES</text>
    </g>
    <g transform="translate(325, 20)"><text x="0" y="70" text-anchor="middle" font-size="12" font-weight="700" fill="#94a3b8">ASSISTANT</text></g>
    <g transform="translate(450, 20)"><text x="0" y="70" text-anchor="middle" font-size="12" font-weight="700" fill="#94a3b8">SETTINGS</text></g>
  </g>
</svg>