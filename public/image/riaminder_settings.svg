<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 1080" width="540" height="1080">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap');
      text { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
    </style>
  </defs>

  <rect width="540" height="1080" rx="40" fill="#1e293b" opacity="0.4"/>

  <!-- Right Slideout Settings Card Drawer matching Image 6 -->
  <g transform="translate(140, 0)">
    <rect width="400" height="1080" fill="#ffffff"/>

    <!-- Header: Riaminder & Close -->
    <g transform="translate(32, 54)">
      <rect width="42" height="42" rx="14" fill="#ff3366"/>
      <text x="21" y="27" text-anchor="middle" font-size="20" fill="#ffffff">🔔</text>
      <text x="56" y="29" font-size="26" font-weight="800" fill="#0f172a">
        <tspan fill="#ff3366">Ria</tspan>minder
      </text>
      <text x="330" y="28" font-size="20" fill="#94a3b8" cursor="pointer">✕</text>
    </g>

    <!-- Cards List -->
    <g transform="translate(32, 120)">
      <!-- Privacy & Security -->
      <g transform="translate(0, 0)">
        <rect width="336" height="74" rx="20" fill="#ffffff" stroke="#f1f5f9"/>
        <rect x="16" y="14" width="46" height="46" rx="14" fill="#ffe4e6"/>
        <text x="39" y="42" text-anchor="middle" font-size="20" fill="#ff3366">🛡</text>
        <text x="76" y="34" font-size="14" font-weight="800" fill="#0f172a">Privacy &amp; Security</text>
        <text x="76" y="50" font-size="9" font-weight="800" fill="#94a3b8" letter-spacing="1">SAFETY CONTROLS</text>
      </g>

      <!-- Premium Pro -->
      <g transform="translate(0, 90)">
        <rect width="336" height="74" rx="20" fill="#ffffff" stroke="#f1f5f9"/>
        <rect x="16" y="14" width="46" height="46" rx="14" fill="#fef3c7"/>
        <text x="39" y="42" text-anchor="middle" font-size="20" fill="#f59e0b">⭐</text>
        <text x="76" y="34" font-size="14" font-weight="800" fill="#0f172a">Premium Pro</text>
        <text x="76" y="50" font-size="9" font-weight="800" fill="#94a3b8" letter-spacing="1">UNLOCK FEATURES</text>
      </g>

      <text x="4" y="200" font-size="10.5" font-weight="800" fill="#94a3b8" letter-spacing="1.5">APPEARANCE</text>

      <!-- Light Mode Toggle -->
      <g transform="translate(0, 215)">
        <rect width="336" height="74" rx="20" fill="#ffffff" stroke="#f1f5f9"/>
        <rect x="16" y="14" width="46" height="46" rx="14" fill="#f0f9ff"/>
        <text x="39" y="42" text-anchor="middle" font-size="20" fill="#0284c7">☼</text>
        <text x="76" y="34" font-size="14" font-weight="800" fill="#0f172a">Light Mode</text>
        <text x="76" y="50" font-size="9" font-weight="800" fill="#94a3b8" letter-spacing="1">SYSTEM THEME</text>
        <!-- Toggle switch -->
        <rect x="260" y="24" width="48" height="26" rx="13" fill="#e2e8f0"/>
        <circle cx="273" cy="37" r="10" fill="#ffffff"/>
      </g>

      <!-- Theme Color Palette -->
      <g transform="translate(0, 305)">
        <rect width="336" height="110" rx="20" fill="#ffffff" stroke="#f1f5f9"/>
        <rect x="16" y="14" width="46" height="46" rx="14" fill="#fdf2f8"/>
        <rect x="28" y="26" width="22" height="22" rx="6" fill="#ff3366"/>
        <text x="76" y="34" font-size="14" font-weight="800" fill="#0f172a">Theme Color</text>
        <text x="76" y="50" font-size="9" font-weight="800" fill="#94a3b8" letter-spacing="1">PERSONALIZE STYLE</text>

        <!-- Color Dots matching Image 6 -->
        <g transform="translate(20, 72)">
          <circle cx="12" cy="12" r="12" fill="#2563eb"/>
          <circle cx="46" cy="12" r="12" fill="#9333ea"/>
          <!-- Selected Red with Checkmark -->
          <circle cx="82" cy="12" r="15" fill="#0f172a"/>
          <circle cx="82" cy="12" r="12" fill="#ff3366"/>
          <text x="82" y="16" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff">✓</text>
          <circle cx="118" cy="12" r="12" fill="#f59e0b"/>
          <circle cx="152" cy="12" r="12" fill="#6366f1"/>
          <circle cx="186" cy="12" r="12" fill="#f43f5e"/>
        </g>
      </g>

      <!-- Language -->
      <g transform="translate(0, 430)">
        <rect width="336" height="74" rx="20" fill="#ffffff" stroke="#f1f5f9"/>
        <rect x="16" y="14" width="46" height="46" rx="14" fill="#f0fdf4"/>
        <text x="39" y="42" text-anchor="middle" font-size="20" fill="#16a34a">🌐</text>
        <text x="76" y="34" font-size="14" font-weight="800" fill="#0f172a">Language</text>
        <text x="76" y="50" font-size="9" font-weight="800" fill="#94a3b8" letter-spacing="1">ENGLISH (US)</text>
        <text x="290" y="42" font-size="16" fill="#94a3b8">›</text>
      </g>

      <!-- Feedback & Help Center -->
      <g transform="translate(0, 520)">
        <rect width="160" height="70" rx="18" fill="#f8fafc"/>
        <text x="80" y="34" text-anchor="middle" font-size="18" fill="#64748b">✈</text>
        <text x="80" y="52" text-anchor="middle" font-size="10.5" font-weight="800" fill="#475569">FEEDBACK</text>

        <rect x="176" width="160" height="70" rx="18" fill="#f8fafc"/>
        <text x="256" y="34" text-anchor="middle" font-size="18" fill="#64748b">❓</text>
        <text x="256" y="52" text-anchor="middle" font-size="10.5" font-weight="800" fill="#475569">HELP CENTER</text>
      </g>

      <!-- LOGOUT ACCOUNT -->
      <g transform="translate(0, 610)">
        <rect width="336" height="56" rx="24" fill="#fff1f2"/>
        <text x="168" y="34" text-anchor="middle" font-size="12" font-weight="800" fill="#ff3366" letter-spacing="1">🚪 LOGOUT ACCOUNT</text>
      </g>
    </g>
  </g>
</svg>