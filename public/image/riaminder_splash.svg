<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 1080" width="540" height="1080">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap');
      text { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
    </style>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f4ff"/>
      <stop offset="50%" stop-color="#e2ecfe"/>
      <stop offset="100%" stop-color="#b6d0fc"/>
    </linearGradient>
    <linearGradient id="tile-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b8aff"/>
      <stop offset="40%" stop-color="#166fe5"/>
      <stop offset="100%" stop-color="#0251c6"/>
    </linearGradient>
    <linearGradient id="tile-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6ba6ff"/>
      <stop offset="100%" stop-color="#2d77fc"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3d85ff"/>
      <stop offset="100%" stop-color="#145ae4"/>
    </linearGradient>
    <filter id="tile-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0c4ab8" flood-opacity="0.4"/>
    </filter>
    <filter id="sphere-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="540" height="1080" rx="40" fill="url(#bg-grad)"/>

  <!-- Subtle Concentric Light Circles in Background -->
  <circle cx="270" cy="360" r="280" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.4"/>
  <circle cx="270" cy="360" r="210" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
  <circle cx="270" cy="360" r="140" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>

  <!-- Dot Grid Pattern (Left) -->
  <g transform="translate(40, 320)" opacity="0.45">
    <circle cx="0" cy="0" r="2.5" fill="#3b82f6"/>
    <circle cx="16" cy="0" r="2.5" fill="#3b82f6"/>
    <circle cx="32" cy="0" r="2.5" fill="#3b82f6"/>
    <circle cx="0" cy="16" r="2.5" fill="#3b82f6"/>
    <circle cx="16" cy="16" r="2.5" fill="#3b82f6"/>
    <circle cx="32" cy="16" r="2.5" fill="#3b82f6"/>
    <circle cx="0" cy="32" r="2.5" fill="#3b82f6"/>
    <circle cx="16" cy="32" r="2.5" fill="#3b82f6"/>
    <circle cx="32" cy="32" r="2.5" fill="#3b82f6"/>
  </g>

  <!-- Dot Grid Pattern (Right Bottom) -->
  <g transform="translate(440, 720)" opacity="0.4">
    <circle cx="0" cy="0" r="2.5" fill="#3b82f6"/>
    <circle cx="16" cy="0" r="2.5" fill="#3b82f6"/>
    <circle cx="32" cy="0" r="2.5" fill="#3b82f6"/>
    <circle cx="0" cy="16" r="2.5" fill="#3b82f6"/>
    <circle cx="16" cy="16" r="2.5" fill="#3b82f6"/>
    <circle cx="32" cy="16" r="2.5" fill="#3b82f6"/>
    <circle cx="0" cy="32" r="2.5" fill="#3b82f6"/>
    <circle cx="16" cy="32" r="2.5" fill="#3b82f6"/>
    <circle cx="32" cy="32" r="2.5" fill="#3b82f6"/>
  </g>

  <!-- Floating Glowing Spheres -->
  <circle cx="20" cy="620" r="45" fill="#93c5fd" opacity="0.75" filter="url(#sphere-glow)"/>
  <circle cx="515" cy="545" r="18" fill="#60a5fa" opacity="0.85" filter="url(#sphere-glow)"/>

  <!-- Little Sparkle Stars -->
  <text x="100" y="90" font-size="16" fill="#60a5fa" opacity="0.8">✦</text>
  <text x="500" y="400" font-size="14" fill="#60a5fa" opacity="0.8">✦</text>

  <!-- Orbital Rings around the App Icon -->
  <g transform="translate(270, 360)">
    <!-- Main Elliptical Orbit -->
    <ellipse rx="190" ry="50" fill="none" stroke="#93c5fd" stroke-width="2" stroke-dasharray="350 40" transform="rotate(-15)"/>
    <ellipse rx="180" ry="46" fill="none" stroke="#ffffff" stroke-width="1.2" transform="rotate(-15)" opacity="0.8"/>

    <!-- Small Orbiting Planets -->
    <circle cx="-135" cy="45" r="8" fill="#0066ff"/>
    <circle cx="150" cy="-35" r="6" fill="#0066ff"/>
  </g>

  <!-- 3D Glossy Blue App Tile Icon -->
  <g transform="translate(180, 270)" filter="url(#tile-shadow)">
    <!-- Base Squircle -->
    <rect width="180" height="180" rx="48" fill="url(#tile-grad)"/>

    <!-- Gloss Highlight Overlay -->
    <rect width="180" height="90" rx="48" fill="url(#tile-gloss)"/>

    <!-- Sparkles on top left of tile -->
    <text x="24" y="44" font-size="15" fill="#ffffff" opacity="0.9">✦</text>

    <!-- White Circular Ring & Checkmark (Riaminder Logo Symbol) -->
    <g transform="translate(90, 90)">
      <!-- Outer circle ring -->
      <path d="M 0 -45 A 45 45 0 1 1 -32 32 L -20 20 A 28 28 0 1 0 0 -28 A 28 28 0 1 0 28 0 A 28 28 0 0 0 10 -26 L 10 -43 A 45 45 0 0 1 45 0 A 45 45 0 0 1 -45 0 A 45 45 0 0 1 0 -45 Z" fill="#ffffff"/>

      <!-- Checkmark -->
      <path d="M -16 2 L -4 14 L 24 -14" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Corner wedge badge shape on bottom right of the icon -->
      <path d="M 12 18 L 36 18 Q 42 18 42 24 L 42 36 Q 42 42 36 42 L 18 42 Q 12 42 12 36 Z" fill="#ffffff"/>
    </g>
  </g>

  <!-- Brand Wordmark: "Riaminder" matching Image 1 -->
  <g transform="translate(270, 535)">
    <text text-anchor="middle" font-size="52" font-weight="800" letter-spacing="-1">
      <tspan fill="#0066ff">Ria</tspan><tspan fill="#0c1938">minder</tspan>
    </text>

    <!-- Curved Underline Swoosh -->
    <path d="M -180 20 Q 0 -5 180 20 Q 0 5 -180 20 Z" fill="#0066ff" opacity="0.85"/>
  </g>

  <!-- 3 Value Proposition Pills matching Image 1 -->
  <g transform="translate(270, 660)">
    <!-- Plan. -->
    <g transform="translate(-170, 0)">
      <rect x="-16" y="-16" width="32" height="32" rx="10" fill="#0066ff"/>
      <g transform="translate(-8, -8)">
        <rect width="16" height="16" rx="2" fill="none" stroke="#ffffff" stroke-width="1.8"/>
        <line x1="0" y1="5" x2="16" y2="5" stroke="#ffffff" stroke-width="1.8"/>
      </g>
      <text x="24" y="6" font-size="17" font-weight="700" fill="#0c1938">Plan.</text>
    </g>

    <!-- Remember. -->
    <g transform="translate(-35, 0)">
      <circle cx="0" cy="0" r="16" fill="#0066ff"/>
      <g transform="translate(-8, -8)">
        <path d="M8 2 A6 6 0 0 0 2 8 L2 11 L0 13 L16 13 L14 11 L14 8 A6 6 0 0 0 8 2 Z" fill="#ffffff"/>
        <circle cx="8" cy="15" r="1.5" fill="#ffffff"/>
      </g>
      <text x="24" y="6" font-size="17" font-weight="700" fill="#0c1938">Remember.</text>
    </g>

    <!-- Achieve. -->
    <g transform="translate(130, 0)">
      <circle cx="0" cy="0" r="16" fill="#0066ff"/>
      <g transform="translate(-8, -8)">
        <path d="M3 4 L13 4 L11 11 Q8 14 5 11 Z" fill="#ffffff"/>
        <line x1="8" y1="12" x2="8" y2="15" stroke="#ffffff" stroke-width="2"/>
        <line x1="5" y1="15" x2="11" y2="15" stroke="#ffffff" stroke-width="2"/>
      </g>
      <text x="24" y="6" font-size="17" font-weight="700" fill="#0c1938">Achieve.</text>
    </g>
  </g>

  <!-- Bottom Waves Section matching Image 1 -->
  <g transform="translate(0, 710)">
    <!-- Back soft Wave -->
    <path d="M 0 100 Q 120 50, 260 120 T 540 100 L 540 370 L 0 370 Z" fill="url(#wave1)" opacity="0.6"/>

    <!-- Front Wave with Smooth Highlight Ribbon -->
    <path d="M 0 160 Q 150 110, 290 190 T 540 130 L 540 370 L 0 370 Z" fill="url(#wave2)"/>
    <path d="M 0 160 Q 150 110, 290 190 T 540 130" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.5"/>
  </g>

  <!-- Progress Bar & Preparing Your Day text -->
  <g transform="translate(270, 795)">
    <!-- Progress Bar Track -->
    <rect x="-195" y="0" width="390" height="12" rx="6" fill="#ffffff" fill-opacity="0.35"/>
    <!-- Blue Progress Filled portion (~48%) -->
    <rect x="-195" y="0" width="185" height="12" rx="6" fill="#0066ff"/>
    <circle cx="-10" cy="6" r="7" fill="#ffffff"/>

    <!-- Status Text -->
    <text y="58" text-anchor="middle" font-size="16" font-weight="800" letter-spacing="1">
      <tspan fill="#334155">PREPARING YOUR </tspan><tspan fill="#0066ff">DAY</tspan>
    </text>
  </g>
</svg>