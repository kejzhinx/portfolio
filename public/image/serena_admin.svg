<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&amp;display=swap');
      text { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
      .serif { font-family: 'Playfair Display', Georgia, serif; }
    </style>
    <filter id="shadow-soft" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#1e1814" flood-opacity="0.06"/>
    </filter>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#1e1814" flood-opacity="0.05"/>
    </filter>
    <linearGradient id="sandstoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e8d8"/>
      <stop offset="50%" stop-color="#e8d5be"/>
      <stop offset="100%" stop-color="#dbc2a4"/>
    </linearGradient>
    <linearGradient id="travertineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf8f0"/>
      <stop offset="100%" stop-color="#eedfc8"/>
    </linearGradient>
  </defs>


  <rect width="1920" height="1080" fill="#fffaf5"/>
  
  <!-- Navigation Header -->
  <g transform="translate(100, 36)">
    <!-- Brand -->
    <text x="0" y="24" class="serif" font-size="22" font-weight="700" fill="#1e1814" letter-spacing="3">SERENA HEART CRYSTALS</text>
    <text x="380" y="24" font-size="10" font-weight="600" fill="#b8860b" letter-spacing="2">STUDIO &amp; HOMEWARES</text>

    <!-- Nav Links -->
    <g transform="translate(850, 24)">
      <text x="0" y="0" font-size="11.5" font-weight="600" fill="#665e54" letter-spacing="2">COLLECTIONS</text>
      <text x="160" y="0" font-size="11.5" font-weight="600" fill="#665e54" letter-spacing="2">PHILOSOPHY</text>
      <text x="310" y="0" font-size="11.5" font-weight="600" fill="#665e54" letter-spacing="2">CURATION</text>
      <text x="440" y="0" font-size="11.5" font-weight="600" fill="#b8860b" letter-spacing="2">ADMIN STUDIO</text>
    </g>

    <!-- Bag Action -->
    <g transform="translate(1550, 6)">
      <rect width="170" height="42" fill="#1e1814"/>
      <text x="85" y="26" text-anchor="middle" font-size="11" font-weight="600" fill="#fff1e6" letter-spacing="2">SHOPPING BAG (2)</text>
    </g>
  </g>
  <line x1="100" y1="92" x2="1820" y2="92" stroke="#ebd5bf" stroke-width="1"/>


  <g transform="translate(100, 140)">
    <g transform="translate(0, 0)">
      <text x="0" y="0" font-size="11" font-weight="700" fill="#b8860b" letter-spacing="3">OPERATIONS &amp; FULFILLMENT</text>
      <text x="0" y="44" class="serif" font-size="44" fill="#1e1814">Serena Admin Studio</text>
      <text x="0" y="78" font-size="15" fill="#665e54">Live order pipeline, GCash transaction confirmation, and stone inventory controller.</text>
    </g>

    <!-- 4 Stats Cards -->
    <g transform="translate(0, 120)">
      <g transform="translate(0, 0)">
        <rect width="405" height="120" fill="#ffffff" stroke="#ebd5bf"/>
        <text x="25" y="36" font-size="11" font-weight="700" fill="#b8860b" letter-spacing="2">ACTIVE PIPELINE</text>
        <text x="25" y="80" class="serif" font-size="34" font-weight="700" fill="#1e1814">14 Orders</text>
        <text x="25" y="102" font-size="12" fill="#047857">↑ 3 awaiting payment proof</text>
      </g>

      <g transform="translate(440, 0)">
        <rect width="405" height="120" fill="#ffffff" stroke="#ebd5bf"/>
        <text x="25" y="36" font-size="11" font-weight="700" fill="#b8860b" letter-spacing="2">TOTAL REVENUE (MTD)</text>
        <text x="25" y="80" class="serif" font-size="34" font-weight="700" fill="#1e1814">₱184,250</text>
        <text x="25" y="102" font-size="12" fill="#047857">100% verified via GCash/BPI</text>
      </g>

      <g transform="translate(880, 0)">
        <rect width="405" height="120" fill="#ffffff" stroke="#ebd5bf"/>
        <text x="25" y="36" font-size="11" font-weight="700" fill="#b8860b" letter-spacing="2">AVAILABLE STOCK</text>
        <text x="25" y="80" class="serif" font-size="34" font-weight="700" fill="#1e1814">42 Sculptures</text>
        <text x="25" y="102" font-size="12" fill="#665e54">Across 6 product categories</text>
      </g>

      <g transform="translate(1320, 0)">
        <rect width="405" height="120" fill="#ffffff" stroke="#ebd5bf"/>
        <text x="25" y="36" font-size="11" font-weight="700" fill="#b8860b" letter-spacing="2">DISPATCH STATUS</text>
        <text x="25" y="80" class="serif" font-size="34" font-weight="700" fill="#1e1814">8 Shipped</text>
        <text x="25" y="102" font-size="12" fill="#b8860b">Fragile wooden crate packed</text>
      </g>
    </g>

    <!-- Orders Table -->
    <g transform="translate(0, 280)">
      <rect width="1720" height="520" fill="#ffffff" stroke="#ebd5bf"/>
      
      <!-- Table Header -->
      <g transform="translate(30, 40)">
        <text x="0" y="0" font-size="11" font-weight="700" fill="#b8860b" letter-spacing="2">ORDER ID</text>
        <text x="200" y="0" font-size="11" font-weight="700" fill="#b8860b" letter-spacing="2">CLIENT NAME</text>
        <text x="500" y="0" font-size="11" font-weight="700" fill="#b8860b" letter-spacing="2">ITEMS ORDERED</text>
        <text x="950" y="0" font-size="11" font-weight="700" fill="#b8860b" letter-spacing="2">PAYMENT METHOD</text>
        <text x="1250" y="0" font-size="11" font-weight="700" fill="#b8860b" letter-spacing="2">TOTAL</text>
        <text x="1450" y="0" font-size="11" font-weight="700" fill="#b8860b" letter-spacing="2">FULFILLMENT</text>
      </g>
      <line x1="30" y1="58" x2="1690" y2="58" stroke="#ebd5bf"/>

      <!-- Row 1 -->
      <g transform="translate(30, 110)">
        <text x="0" y="0" font-family="monospace" font-size="13" font-weight="700" fill="#1e1814">#SHC-8491</text>
        <text x="200" y="0" font-size="14" font-weight="600" fill="#1e1814">Maria Elena Santos</text>
        <text x="500" y="0" font-size="13" fill="#665e54">The Solis Sandstone Vessel, Travertine Burner</text>
        <rect x="950" y="-18" width="110" height="26" rx="4" fill="#e0f2fe"/>
        <text x="1005" y="-1" text-anchor="middle" font-size="11" font-weight="700" fill="#0284c7">GCash Paid</text>
        <text x="1250" y="0" class="serif" font-size="16" font-weight="700" fill="#1e1814">₱7,000</text>
        <rect x="1450" y="-18" width="120" height="26" rx="4" fill="#ecfdf5"/>
        <text x="1510" y="-1" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">Crate Packed</text>
      </g>
      <line x1="30" y1="135" x2="1690" y2="135" stroke="#f4ede6"/>

      <!-- Row 2 -->
      <g transform="translate(30, 185)">
        <text x="0" y="0" font-family="monospace" font-size="13" font-weight="700" fill="#1e1814">#SHC-8490</text>
        <text x="200" y="0" font-size="14" font-weight="600" fill="#1e1814">Arch. Carlos V. Mendoza</text>
        <text x="500" y="0" font-size="13" fill="#665e54">Calacatta Honed Pedestal Dish (2x)</text>
        <rect x="950" y="-18" width="110" height="26" rx="4" fill="#fdf4ff"/>
        <text x="1005" y="-1" text-anchor="middle" font-size="11" font-weight="700" fill="#9333ea">BPI Wire</text>
        <text x="1250" y="0" class="serif" font-size="16" font-weight="700" fill="#1e1814">₱11,200</text>
        <rect x="1450" y="-18" width="120" height="26" rx="4" fill="#ecfdf5"/>
        <text x="1510" y="-1" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">In Transit</text>
      </g>
      <line x1="30" y1="210" x2="1690" y2="210" stroke="#f4ede6"/>

      <!-- Row 3 -->
      <g transform="translate(30, 260)">
        <text x="0" y="0" font-family="monospace" font-size="13" font-weight="700" fill="#1e1814">#SHC-8489</text>
        <text x="200" y="0" font-size="14" font-weight="600" fill="#1e1814">Sofia Alcantara</text>
        <text x="500" y="0" font-size="13" fill="#665e54">The Monolith Fluted Tray (Sandstone)</text>
        <rect x="950" y="-18" width="110" height="26" rx="4" fill="#e0f2fe"/>
        <text x="1005" y="-1" text-anchor="middle" font-size="11" font-weight="700" fill="#0284c7">GCash Paid</text>
        <text x="1250" y="0" class="serif" font-size="16" font-weight="700" fill="#1e1814">₱3,200</text>
        <rect x="1450" y="-18" width="120" height="26" rx="4" fill="#fef3c7"/>
        <text x="1510" y="-1" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309">Chiseling</text>
      </g>
    </g>
  </g>
</svg>
