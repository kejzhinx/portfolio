<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 960" width="1920" height="960">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Playfair+Display:ital,wght@1,500;1,600&amp;display=swap');
      text { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
      .serif { font-family: 'Playfair Display', Georgia, serif; }
    </style>
  </defs>

  <rect width="1920" height="960" fill="#faf8f5"/>

  <!-- SIDEBAR (w: 260px) -->
  <g transform="translate(0, 0)">
    <rect width="260" height="960" fill="#faf8f5"/>
    <line x1="260" y1="0" x2="260" y2="960" stroke="#ede5db" stroke-width="1"/>

    <!-- Brand -->
    <g transform="translate(36, 44)">
      <text x="0" y="24" class="serif" font-size="28" font-style="italic" font-weight="600" fill="#1e1814" letter-spacing="-0.5">Serena Heart</text>
      <text x="0" y="52" class="serif" font-size="28" font-style="italic" font-weight="600" fill="#1e1814" letter-spacing="-0.5">Crystals</text>
      <text x="0" y="74" font-size="8.5" font-weight="700" fill="#a48a6d" letter-spacing="2">STUDIO ADMIN PORTAL</text>
    </g>

    <!-- Nav Items -->
    <g transform="translate(24, 150)">
      <!-- DASHBOARD (Active Black Box) -->
      <g transform="translate(0, 0)">
        <rect width="212" height="42" rx="4" fill="#1c1c1c"/>
        <g transform="translate(14, 13)">
          <rect width="6" height="6" fill="#e8ce9e"/>
          <rect x="9" width="6" height="6" fill="#e8ce9e"/>
          <rect y="9" width="6" height="6" fill="#e8ce9e"/>
          <rect x="9" y="9" width="6" height="6" fill="#e8ce9e"/>
        </g>
        <text x="38" y="26" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="1.5">DASHBOARD</text>
      </g>

      <!-- PRODUCTS -->
      <g transform="translate(0, 52)">
        <g transform="translate(14, 13)">
          <rect width="14" height="14" fill="none" stroke="#8c8273" stroke-width="1.5"/>
          <line x1="0" y1="5" x2="14" y2="5" stroke="#8c8273" stroke-width="1.5"/>
        </g>
        <text x="38" y="26" font-size="11" font-weight="600" fill="#665e54" letter-spacing="1.5">PRODUCTS</text>
      </g>

      <!-- ORDERS -->
      <g transform="translate(0, 104)">
        <g transform="translate(14, 13)">
          <path d="M2 4 L13 4 L11 14 L4 14 Z" fill="none" stroke="#8c8273" stroke-width="1.5"/>
          <path d="M5 4 Q7.5 1 10 4" fill="none" stroke="#8c8273" stroke-width="1.5"/>
        </g>
        <text x="38" y="26" font-size="11" font-weight="600" fill="#665e54" letter-spacing="1.5">ORDERS</text>
      </g>

      <!-- SALES TRACKING -->
      <g transform="translate(0, 156)">
        <g transform="translate(14, 13)">
          <path d="M1 12 L5 7 L9 10 L14 3" fill="none" stroke="#8c8273" stroke-width="1.5"/>
        </g>
        <text x="38" y="26" font-size="11" font-weight="600" fill="#665e54" letter-spacing="1.5">SALES TRACKING</text>
      </g>

      <!-- PAYMENT OPTIONS -->
      <g transform="translate(0, 208)">
        <g transform="translate(14, 13)">
          <rect width="14" height="10" rx="1.5" fill="none" stroke="#8c8273" stroke-width="1.5"/>
          <line x1="0" y1="3" x2="14" y2="3" stroke="#8c8273" stroke-width="1"/>
        </g>
        <text x="38" y="26" font-size="11" font-weight="600" fill="#665e54" letter-spacing="1.5">PAYMENT OPTIONS</text>
      </g>

      <!-- Divider & LOGOUT -->
      <line x1="0" y1="262" x2="212" y2="262" stroke="#ede5db"/>
      <g transform="translate(0, 276)">
        <g transform="translate(14, 13)">
          <path d="M6 2 L2 2 L2 13 L6 13" fill="none" stroke="#b93b3b" stroke-width="1.5"/>
          <path d="M9 4 L13 7.5 L9 11" fill="none" stroke="#b93b3b" stroke-width="1.5"/>
          <line x1="4" y1="7.5" x2="13" y2="7.5" stroke="#b93b3b" stroke-width="1.5"/>
        </g>
        <text x="38" y="26" font-size="11" font-weight="700" fill="#b93b3b" letter-spacing="1.5">LOGOUT</text>
      </g>
    </g>
  </g>

  <!-- MAIN AREA (x: 290) -->
  <g transform="translate(290, 0)">
    <!-- Breadcrumb Header -->
    <g transform="translate(10, 42)">
      <text x="0" y="0" font-size="11" font-weight="700" fill="#1c1c1c" letter-spacing="2">SERENA HEART CRYSTALS STUDIO</text>
      <text x="280" y="0" font-size="11" font-weight="600" fill="#b39268" letter-spacing="1">/  Dashboard</text>
    </g>
    <line x1="0" y1="68" x2="1600" y2="68" stroke="#ede5db"/>

    <!-- 3 Stat Cards Grid -->
    <g transform="translate(10, 110)">
      <!-- Card 1: Total Revenue -->
      <g transform="translate(0, 0)">
        <rect width="515" height="145" fill="#f4f1ee" stroke="#e8e2db"/>
        <text x="26" y="38" font-size="10" font-weight="700" fill="#8c8273" letter-spacing="1.5">TOTAL REVENUE (PHP)</text>
        <text x="26" y="92" class="serif" font-size="44" font-weight="500" fill="#1c1c1c">₱56,000</text>
        <text x="26" y="122" font-size="12" font-weight="600" fill="#a48a6d">+18.4% vs last month</text>
      </g>

      <!-- Card 2: Active Orders -->
      <g transform="translate(535, 0)">
        <rect width="515" height="145" fill="#f4f1ee" stroke="#e8e2db"/>
        <text x="26" y="38" font-size="10" font-weight="700" fill="#8c8273" letter-spacing="1.5">ACTIVE ORDERS</text>
        <text x="26" y="92" class="serif" font-size="44" font-weight="500" fill="#1c1c1c">7</text>
        <text x="26" y="122" font-size="12" font-weight="500" fill="#665e54">8 total orders recorded</text>
      </g>

      <!-- Card 3: Conversion Rate -->
      <g transform="translate(1070, 0)">
        <rect width="515" height="145" fill="#f4f1ee" stroke="#e8e2db"/>
        <text x="26" y="38" font-size="10" font-weight="700" fill="#8c8273" letter-spacing="1.5">CONVERSION RATE</text>
        <text x="26" y="92" class="serif" font-size="44" font-weight="500" fill="#1c1c1c">3.2%</text>
        <text x="26" y="122" font-size="12" font-weight="500" fill="#665e54">4.8k storefront sessions</text>
      </g>
    </g>

    <!-- July Sales Tracking Curve Container -->
    <g transform="translate(10, 290)">
      <rect width="1585" height="510" fill="#ffffff" stroke="#e8e2db"/>

      <g transform="translate(26, 44)">
        <text x="0" y="0" class="serif" font-size="28" font-weight="500" fill="#1c1c1c">July Sales Tracking Curve</text>
        <text x="1530" y="0" text-anchor="end" font-size="11" font-weight="700" fill="#a48a6d" letter-spacing="1.5">PHP REVENUE</text>
      </g>

      <!-- Chart Graphics exactly matching user's Image 1 -->
      <g transform="translate(90, 85)">
        <!-- Y-Axis Labels & horizontal lines -->
        <text x="-14" y="15" text-anchor="end" font-size="11" fill="#8c8273">60000</text>
        <text x="-14" y="95" text-anchor="end" font-size="11" fill="#8c8273">45000</text>
        <text x="-14" y="175" text-anchor="end" font-size="11" fill="#8c8273">30000</text>
        <text x="-14" y="255" text-anchor="end" font-size="11" fill="#8c8273">15000</text>
        <text x="-14" y="335" text-anchor="end" font-size="11" fill="#8c8273">0</text>
        
        <line x1="0" y1="10" x2="0" y2="335" stroke="#d5ceb8"/>

        <!-- The exact Spline Curve Fill & Line -->
        <path d="M 0 210 C 150 230, 220 240, 260 240 C 350 240, 420 200, 520 170 C 620 140, 680 150, 780 150 C 880 150, 950 210, 1020 210 C 1100 210, 1180 90, 1260 50 C 1320 40, 1400 35, 1460 30 L 1460 335 L 0 335 Z" fill="#ede5db"/>
        <path d="M 0 210 C 150 230, 220 240, 260 240 C 350 240, 420 200, 520 170 C 620 140, 680 150, 780 150 C 880 150, 950 210, 1020 210 C 1100 210, 1180 90, 1260 50 C 1320 40, 1400 35, 1460 30" fill="none" stroke="#1c1c1c" stroke-width="2"/>

        <!-- X-Axis Line & Dates matching Image 1 -->
        <line x1="0" y1="335" x2="1460" y2="335" stroke="#d5ceb8"/>
        <text x="0" y="352" text-anchor="middle" font-size="11" fill="#8c8273">Jul 25</text>
        <text x="245" y="352" text-anchor="middle" font-size="11" fill="#8c8273">Jul 26</text>
        <text x="490" y="352" text-anchor="middle" font-size="11" fill="#8c8273">Jul 27</text>
        <text x="730" y="352" text-anchor="middle" font-size="11" fill="#8c8273">Jul 28</text>
        <text x="980" y="352" text-anchor="middle" font-size="11" fill="#8c8273">Jul 29</text>
        <text x="1225" y="352" text-anchor="middle" font-size="11" fill="#8c8273">Jul 30</text>
        <text x="1460" y="352" text-anchor="middle" font-size="11" fill="#8c8273">Jul 31</text>
      </g>
    </g>
  </g>
</svg>