<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 960" width="780" height="960">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Playfair+Display:wght@500;600&amp;display=swap');
      text { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
      .serif { font-family: 'Playfair Display', Georgia, serif; }
    </style>
  </defs>

  <rect width="780" height="960" fill="#faf8f5"/>
  <rect x="0" y="0" width="780" height="960" fill="none" stroke="#e8e2db" stroke-width="1"/>

  <!-- Top Header Ribbon -->
  <g transform="translate(40, 44)">
    <g transform="translate(0, 0)">
      <path d="M2 4 L14 4 L12 15 L4 15 Z" fill="none" stroke="#8c8273" stroke-width="1.8"/>
      <path d="M5 4 Q8 1 11 4" fill="none" stroke="#8c8273" stroke-width="1.8"/>
    </g>
    <text x="24" y="14" class="serif" font-size="23" font-weight="600" fill="#1c1c1c" letter-spacing="1.5">SHOPPING BAG</text>
    <text x="690" y="14" font-size="20" fill="#1c1c1c" cursor="pointer">✕</text>
  </g>
  <line x1="0" y1="76" x2="780" y2="76" stroke="#ede5db"/>

  <!-- Shopping Bag Item 1 matching Image 7 -->
  <g transform="translate(40, 110)">
    <rect width="700" height="120" fill="#ffffff" stroke="#e8e2db"/>

    <!-- Real pedestal thumbnail -->
    <g transform="translate(24, 20)">
      <rect width="80" height="80" fill="#f4f1ee"/>
      <image href="/image/serena_pedestal.jpg" width="80" height="80" preserveAspectRatio="xMidYMid slice"/>
    </g>

    <g transform="translate(125, 34)">
      <text x="0" y="0" font-size="10" font-weight="700" fill="#a48a6d" letter-spacing="1.5">SCULPTURAL OBJECTS</text>
      <text x="0" y="24" class="serif" font-size="21" font-weight="600" fill="#1c1c1c">Altar Sculptural Pedestal</text>
      <text x="0" y="52" class="serif" font-size="17" font-weight="600" fill="#1c1c1c">₱6,200</text>
    </g>

    <!-- Quantity - 1 + Controls & Trash -->
    <g transform="translate(490, 40)">
      <rect width="125" height="36" fill="#faf8f5" stroke="#e8e2db"/>
      <text x="22" y="23" text-anchor="middle" font-size="14" fill="#665e54">-</text>
      <text x="62" y="23" text-anchor="middle" font-size="13" font-weight="700" fill="#1c1c1c">1</text>
      <text x="103" y="23" text-anchor="middle" font-size="14" fill="#665e54">+</text>
    </g>

    <g transform="translate(640, 48)">
      <path d="M2 4 L14 4 M5 4 L5 1 L11 1 L11 4 M4 4 L5 15 L11 15 L12 4" fill="none" stroke="#8c8273" stroke-width="1.4"/>
    </g>
  </g>

  <!-- Bottom Totals & Checkout Button -->
  <g transform="translate(40, 760)">
    <g transform="translate(0, 0)">
      <text x="0" y="0" font-size="13" fill="#665e54">Subtotal</text>
      <text x="700" y="0" text-anchor="end" font-size="13" font-weight="600" fill="#1c1c1c">₱6,200</text>

      <text x="0" y="28" font-size="13" fill="#665e54">Heavy Fragile Courier Shipping</text>
      <text x="700" y="28" text-anchor="end" font-size="13" font-weight="600" fill="#1c1c1c">₱250</text>

      <line x1="0" y1="52" x2="700" y2="52" stroke="#ede5db"/>

      <text x="0" y="85" font-size="14" font-weight="700" fill="#1c1c1c">Total (PHP)</text>
      <text x="700" y="85" text-anchor="end" class="serif" font-size="28" font-weight="700" fill="#1c1c1c">₱6,450</text>
    </g>

    <g transform="translate(0, 130)">
      <rect width="700" height="54" fill="#1c1c1c"/>
      <text x="350" y="34" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="2.5">PROCEED TO CUSTOM CHECKOUT →</text>
    </g>
  </g>
</svg>