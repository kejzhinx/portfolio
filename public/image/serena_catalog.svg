<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&amp;display=swap');
      text { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
      .serif { font-family: 'Playfair Display', Georgia, serif; }
    </style>
    <filter id="shadow-soft" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#1e1814" flood-opacity="0.06"/>
    </filter>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#1e1814" flood-opacity="0.05"/>
    </filter>
    <linearGradient id="sandstoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e8d8"/>
      <stop offset="50%" stop-color="#e8d5be"/>
      <stop offset="100%" stop-color="#dbc2a4"/>
    </linearGradient>
    <linearGradient id="travertineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf8f0"/>
      <stop offset="100%" stop-color="#eedfc8"/>
    </linearGradient>
  </defs>


  <rect width="1920" height="1080" fill="#fffaf5"/>
  
  <!-- Navigation Header -->
  <g transform="translate(100, 36)">
    <!-- Brand -->
    <text x="0" y="24" class="serif" font-size="22" font-weight="700" fill="#1e1814" letter-spacing="3">SERENA HEART CRYSTALS</text>
    <text x="380" y="24" font-size="10" font-weight="600" fill="#b8860b" letter-spacing="2">STUDIO &amp; HOMEWARES</text>

    <!-- Nav Links -->
    <g transform="translate(850, 24)">
      <text x="0" y="0" font-size="11.5" font-weight="600" fill="#b8860b" letter-spacing="2">COLLECTIONS</text>
      <text x="160" y="0" font-size="11.5" font-weight="600" fill="#665e54" letter-spacing="2">PHILOSOPHY</text>
      <text x="310" y="0" font-size="11.5" font-weight="600" fill="#665e54" letter-spacing="2">CURATION</text>
      <text x="440" y="0" font-size="11.5" font-weight="600" fill="#665e54" letter-spacing="2">ADMIN STUDIO</text>
    </g>

    <!-- Bag Action -->
    <g transform="translate(1550, 6)">
      <rect width="170" height="42" fill="#1e1814"/>
      <text x="85" y="26" text-anchor="middle" font-size="11" font-weight="600" fill="#fff1e6" letter-spacing="2">SHOPPING BAG (2)</text>
    </g>
  </g>
  <line x1="100" y1="92" x2="1820" y2="92" stroke="#ebd5bf" stroke-width="1"/>


  <g transform="translate(100, 140)">
    <text x="0" y="0" font-size="11" font-weight="700" fill="#b8860b" letter-spacing="3">CURATED COLLECTION</text>
    <text x="0" y="44" class="serif" font-size="44" fill="#1e1814">Sculpted Stone Homewares</text>
    <text x="0" y="78" font-size="15" fill="#665e54">Handcrafted sculptural monoliths, incense holders, and tactile trays designed for enduring sanctuary.</text>

    <!-- Category Filter Tabs matching BASE_CATEGORIES -->
    <g transform="translate(0, 120)">
      <!-- Tab 1: All (Active) -->
      <rect width="90" height="38" fill="#1e1814"/>
      <text x="45" y="23" text-anchor="middle" font-size="11" font-weight="700" fill="#fff1e6" letter-spacing="1.5">ALL (18)</text>

      <rect x="105" width="120" height="38" fill="#fff8f3" stroke="#ebd5bf"/>
      <text x="165" y="23" text-anchor="middle" font-size="11" font-weight="600" fill="#1e1814" letter-spacing="1">VESSELS</text>

      <rect x="240" width="190" height="38" fill="#fff8f3" stroke="#ebd5bf"/>
      <text x="335" y="23" text-anchor="middle" font-size="11" font-weight="600" fill="#1e1814" letter-spacing="1">SCULPTURAL OBJECTS</text>

      <rect x="445" width="170" height="38" fill="#fff8f3" stroke="#ebd5bf"/>
      <text x="530" y="23" text-anchor="middle" font-size="11" font-weight="600" fill="#1e1814" letter-spacing="1">INCENSE HOLDERS</text>

      <rect x="630" width="190" height="38" fill="#fff8f3" stroke="#ebd5bf"/>
      <text x="725" y="23" text-anchor="middle" font-size="11" font-weight="600" fill="#1e1814" letter-spacing="1">ARCHITECTURAL TRAYS</text>

      <rect x="835" width="140" height="38" fill="#fff8f3" stroke="#ebd5bf"/>
      <text x="905" y="23" text-anchor="middle" font-size="11" font-weight="600" fill="#1e1814" letter-spacing="1">TABLEWARE</text>
    </g>

    <!-- 4-Product Grid -->
    <g transform="translate(0, 190)">
      <!-- Product 1: The Solis Vessel -->
      <g transform="translate(0, 0)" filter="url(#card-shadow)">
        <rect width="405" height="580" fill="#fff8f3" stroke="#ebd5bf"/>
        <rect x="20" y="20" width="365" height="340" fill="url(#sandstoneGrad)"/>
        <!-- Vessel Mini Art -->
        <ellipse cx="202" cy="270" rx="90" ry="18" fill="#cbb296" opacity="0.6"/>
        <path d="M 150 260 C 120 190, 130 110, 160 60 C 180 30, 225 30, 245 60 C 275 110, 285 190, 255 260 Z" fill="#e4d1bc" stroke="#cbb296" stroke-width="2"/>
        <ellipse cx="202" cy="60" rx="42" ry="9" fill="#3d332d"/>
        <g transform="translate(35, 385)">
          <text x="0" y="14" font-size="10" font-weight="700" fill="#b8860b" letter-spacing="2">VESSELS</text>
          <text x="0" y="42" class="serif" font-size="20" font-weight="600" fill="#1e1814">The Solis Sandstone Vessel</text>
          <text x="0" y="68" font-size="12" fill="#665e54">Hand-Carved Natural Sandstone</text>
          <line x1="0" y1="90" x2="335" y2="90" stroke="#ebd5bf"/>
          <text x="0" y="126" class="serif" font-size="22" font-weight="700" fill="#1e1814">₱4,850</text>
          <rect x="235" y="104" width="100" height="34" fill="#1e1814"/>
          <text x="285" y="125" text-anchor="middle" font-size="10.5" font-weight="600" fill="#fff8f3">+ BAG</text>
        </g>
      </g>

      <!-- Product 2: Travertine Sphere Incense Holder -->
      <g transform="translate(440, 0)" filter="url(#card-shadow)">
        <rect width="405" height="580" fill="#fff8f3" stroke="#ebd5bf"/>
        <rect x="20" y="20" width="365" height="340" fill="url(#travertineGrad)"/>
        <circle cx="202" cy="180" r="95" fill="#f5ede2" stroke="#dfcebc" stroke-width="3"/>
        <circle cx="202" cy="120" r="14" fill="#b8860b"/>
        <circle cx="202" cy="120" r="5" fill="#1e1814"/>
        <line x1="202" y1="120" x2="202" y2="30" stroke="#888" stroke-width="2"/>
        <g transform="translate(35, 385)">
          <text x="0" y="14" font-size="10" font-weight="700" fill="#b8860b" letter-spacing="2">INCENSE HOLDERS</text>
          <text x="0" y="42" class="serif" font-size="20" font-weight="600" fill="#1e1814">Travertine Sphere Burner</text>
          <text x="0" y="68" font-size="12" fill="#665e54">Honed Roman Travertine &amp; Brass</text>
          <line x1="0" y1="90" x2="335" y2="90" stroke="#ebd5bf"/>
          <text x="0" y="126" class="serif" font-size="22" font-weight="700" fill="#1e1814">₱2,150</text>
          <rect x="235" y="104" width="100" height="34" fill="#1e1814"/>
          <text x="285" y="125" text-anchor="middle" font-size="10.5" font-weight="600" fill="#fff8f3">+ BAG</text>
        </g>
      </g>

      <!-- Product 3: The Monolith Fluted Tray -->
      <g transform="translate(880, 0)" filter="url(#card-shadow)">
        <rect width="405" height="580" fill="#fff8f3" stroke="#ebd5bf"/>
        <rect x="20" y="20" width="365" height="340" fill="#f7efe4"/>
        <rect x="65" y="90" width="275" height="170" rx="8" fill="#e6d5c1" stroke="#cbb8a2" stroke-width="3"/>
        <line x1="100" y1="105" x2="100" y2="245" stroke="#ba9f83" stroke-width="4"/>
        <line x1="140" y1="105" x2="140" y2="245" stroke="#ba9f83" stroke-width="4"/>
        <line x1="180" y1="105" x2="180" y2="245" stroke="#ba9f83" stroke-width="4"/>
        <line x1="220" y1="105" x2="220" y2="245" stroke="#ba9f83" stroke-width="4"/>
        <line x1="260" y1="105" x2="260" y2="245" stroke="#ba9f83" stroke-width="4"/>
        <line x1="300" y1="105" x2="300" y2="245" stroke="#ba9f83" stroke-width="4"/>
        <g transform="translate(35, 385)">
          <text x="0" y="14" font-size="10" font-weight="700" fill="#b8860b" letter-spacing="2">ARCHITECTURAL TRAYS</text>
          <text x="0" y="42" class="serif" font-size="20" font-weight="600" fill="#1e1814">The Monolith Fluted Tray</text>
          <text x="0" y="68" font-size="12" fill="#665e54">Textured Sandstone Composite</text>
          <line x1="0" y1="90" x2="335" y2="90" stroke="#ebd5bf"/>
          <text x="0" y="126" class="serif" font-size="22" font-weight="700" fill="#1e1814">₱3,200</text>
          <rect x="235" y="104" width="100" height="34" fill="#1e1814"/>
          <text x="285" y="125" text-anchor="middle" font-size="10.5" font-weight="600" fill="#fff8f3">+ BAG</text>
        </g>
      </g>

      <!-- Product 4: Calacatta Stone Pedestal -->
      <g transform="translate(1320, 0)" filter="url(#card-shadow)">
        <rect width="405" height="580" fill="#fff8f3" stroke="#ebd5bf"/>
        <rect x="20" y="20" width="365" height="340" fill="#fdfbf9"/>
        <ellipse cx="202" cy="140" rx="110" ry="32" fill="#ede8e3" stroke="#ccc4bc" stroke-width="3"/>
        <rect x="182" y="140" width="40" height="130" fill="#dfd8d1" stroke="#ccc4bc" stroke-width="2"/>
        <ellipse cx="202" cy="270" rx="70" ry="20" fill="#ede8e3" stroke="#ccc4bc" stroke-width="2"/>
        <g transform="translate(35, 385)">
          <text x="0" y="14" font-size="10" font-weight="700" fill="#b8860b" letter-spacing="2">SCULPTURAL OBJECTS</text>
          <text x="0" y="42" class="serif" font-size="20" font-weight="600" fill="#1e1814">Calacatta Honed Pedestal</text>
          <text x="0" y="68" font-size="12" fill="#665e54">Solid White Marble Centerpiece</text>
          <line x1="0" y1="90" x2="335" y2="90" stroke="#ebd5bf"/>
          <text x="0" y="126" class="serif" font-size="22" font-weight="700" fill="#1e1814">₱5,600</text>
          <rect x="235" y="104" width="100" height="34" fill="#1e1814"/>
          <text x="285" y="125" text-anchor="middle" font-size="10.5" font-weight="600" fill="#fff8f3">+ BAG</text>
        </g>
      </g>
    </g>
  </g>
</svg>
