<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&amp;display=swap');
      text { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
      .serif { font-family: 'Playfair Display', Georgia, serif; }
    </style>
    <filter id="shadow-soft" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#1e1814" flood-opacity="0.06"/>
    </filter>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#1e1814" flood-opacity="0.05"/>
    </filter>
    <linearGradient id="sandstoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e8d8"/>
      <stop offset="50%" stop-color="#e8d5be"/>
      <stop offset="100%" stop-color="#dbc2a4"/>
    </linearGradient>
    <linearGradient id="travertineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf8f0"/>
      <stop offset="100%" stop-color="#eedfc8"/>
    </linearGradient>
  </defs>


  <rect width="1920" height="1080" fill="#fffaf5"/>
  
  <!-- Navigation Header -->
  <g transform="translate(100, 36)">
    <!-- Brand -->
    <text x="0" y="24" class="serif" font-size="22" font-weight="700" fill="#1e1814" letter-spacing="3">SERENA HEART CRYSTALS</text>
    <text x="380" y="24" font-size="10" font-weight="600" fill="#b8860b" letter-spacing="2">STUDIO &amp; HOMEWARES</text>

    <!-- Nav Links -->
    <g transform="translate(850, 24)">
      <text x="0" y="0" font-size="11.5" font-weight="600" fill="#b8860b" letter-spacing="2">COLLECTIONS</text>
      <text x="160" y="0" font-size="11.5" font-weight="600" fill="#665e54" letter-spacing="2">PHILOSOPHY</text>
      <text x="310" y="0" font-size="11.5" font-weight="600" fill="#665e54" letter-spacing="2">CURATION</text>
      <text x="440" y="0" font-size="11.5" font-weight="600" fill="#665e54" letter-spacing="2">ADMIN STUDIO</text>
    </g>

    <!-- Bag Action -->
    <g transform="translate(1550, 6)">
      <rect width="170" height="42" fill="#1e1814"/>
      <text x="85" y="26" text-anchor="middle" font-size="11" font-weight="600" fill="#fff1e6" letter-spacing="2">SHOPPING BAG (2)</text>
    </g>
  </g>
  <line x1="100" y1="92" x2="1820" y2="92" stroke="#ebd5bf" stroke-width="1"/>


  <rect width="1920" height="1080" fill="#1e1814" fill-opacity="0.5"/>

  <!-- Right Slideout Cart Drawer -->
  <g transform="translate(1220, 0)" filter="url(#shadow-soft)">
    <rect width="700" height="1080" fill="#fffaf5" stroke="#ebd5bf"/>

    <!-- Drawer Header -->
    <g transform="translate(50, 50)">
      <text x="0" y="24" class="serif" font-size="28" font-weight="600" fill="#1e1814">Your Shopping Bag</text>
      <text x="0" y="52" font-size="13" fill="#665e54">2 Handcrafted pieces selected for delivery</text>
      <line x1="0" y1="75" x2="600" y2="75" stroke="#ebd5bf"/>
    </g>

    <!-- Cart Item 1 -->
    <g transform="translate(50, 160)">
      <rect width="600" height="130" fill="#fcf4eb" stroke="#ebd5bf"/>
      <rect x="15" y="15" width="100" height="100" fill="url(#sandstoneGrad)"/>
      <g transform="translate(135, 30)">
        <text x="0" y="16" class="serif" font-size="17" font-weight="700" fill="#1e1814">The Solis Sandstone Vessel</text>
        <text x="0" y="40" font-size="12" fill="#665e54">Qty: 1 • Natural Raw Sandstone</text>
        <text x="0" y="70" class="serif" font-size="18" font-weight="700" fill="#1e1814">₱4,850</text>
      </g>
    </g>

    <!-- Cart Item 2 -->
    <g transform="translate(50, 310)">
      <rect width="600" height="130" fill="#fcf4eb" stroke="#ebd5bf"/>
      <rect x="15" y="15" width="100" height="100" fill="url(#travertineGrad)"/>
      <g transform="translate(135, 30)">
        <text x="0" y="16" class="serif" font-size="17" font-weight="700" fill="#1e1814">Travertine Sphere Burner</text>
        <text x="0" y="40" font-size="12" fill="#665e54">Qty: 1 • Honed Roman Limestone</text>
        <text x="0" y="70" class="serif" font-size="18" font-weight="700" fill="#1e1814">₱2,150</text>
      </g>
    </g>

    <!-- Checkout Payment Method Box (GCash & Bank Transfer) -->
    <g transform="translate(50, 480)">
      <rect width="600" height="260" fill="#ffffff" stroke="#b8860b" stroke-width="1.5"/>
      <g transform="translate(25, 25)">
        <text x="0" y="16" font-size="12" font-weight="700" fill="#b8860b" letter-spacing="2">PAYMENT METHOD: GCASH &amp; BANK TRANSFER</text>
        
        <!-- GCash Info Strip -->
        <g transform="translate(0, 35)">
          <rect width="550" height="60" rx="4" fill="#f0f7ff" stroke="#b9d9fc"/>
          <text x="20" y="35" font-size="13" font-weight="700" fill="#007dfa">📱 GCash Merchant QR</text>
          <text x="220" y="35" font-size="13" font-weight="600" fill="#1e1814">0917-882-7491 (Serena Crystals)</text>
        </g>

        <!-- Bank Transfer Info Strip -->
        <g transform="translate(0, 110)">
          <rect width="550" height="60" rx="4" fill="#faf5ff" stroke="#e9d8fd"/>
          <text x="20" y="35" font-size="13" font-weight="700" fill="#6c1d45">🏦 BPI / BDO Transfer</text>
          <text x="220" y="35" font-size="13" font-weight="600" fill="#1e1814">Account # 8492-0192-38 (Checking)</text>
        </g>

        <text x="0" y="200" font-size="11.5" fill="#665e54">Upload transfer screenshot upon order placement for immediate admin verification.</text>
      </g>
    </g>

    <!-- Totals and Checkout CTA -->
    <g transform="translate(50, 780)">
      <line x1="0" y1="0" x2="600" y2="0" stroke="#ebd5bf"/>
      <g transform="translate(0, 30)">
        <text x="0" y="16" font-size="14" fill="#665e54">Subtotal</text>
        <text x="600" y="16" text-anchor="end" font-size="14" font-weight="600" fill="#1e1814">₱7,000</text>

        <text x="0" y="48" font-size="14" fill="#665e54">Nationwide Fragile Delivery</text>
        <text x="600" y="48" text-anchor="end" font-size="14" font-weight="700" fill="#047857">FREE</text>

        <line x1="0" y1="70" x2="600" y2="70" stroke="#ebd5bf"/>

        <text x="0" y="105" class="serif" font-size="22" font-weight="700" fill="#1e1814">Total Amount</text>
        <text x="600" y="105" text-anchor="end" class="serif" font-size="26" font-weight="700" fill="#1e1814">₱7,000</text>
      </g>

      <g transform="translate(0, 160)">
        <rect width="600" height="58" fill="#1e1814"/>
        <text x="300" y="36" text-anchor="middle" font-size="13" font-weight="700" fill="#fff1e6" letter-spacing="2.5">PROCEED TO GCASH CHECKOUT →</text>
      </g>
    </g>
  </g>
</svg>
