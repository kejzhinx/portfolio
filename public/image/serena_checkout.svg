<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 960" width="780" height="960">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Playfair+Display:wght@500;600&amp;display=swap');
      text { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
      .serif { font-family: 'Playfair Display', Georgia, serif; }
    </style>
  </defs>

  <rect width="780" height="960" fill="#faf8f5"/>
  <rect x="0" y="0" width="780" height="960" fill="none" stroke="#e8e2db" stroke-width="1"/>

  <!-- Top Header Ribbon -->
  <g transform="translate(40, 44)">
    <g transform="translate(0, 0)">
      <path d="M2 4 L14 4 L12 15 L4 15 Z" fill="none" stroke="#8c8273" stroke-width="1.8"/>
      <path d="M5 4 Q8 1 11 4" fill="none" stroke="#8c8273" stroke-width="1.8"/>
    </g>
    <text x="24" y="14" class="serif" font-size="23" font-weight="600" fill="#1c1c1c" letter-spacing="1.5">CHECKOUT</text>
    <text x="690" y="14" font-size="20" fill="#1c1c1c" cursor="pointer">✕</text>
  </g>
  <line x1="0" y1="76" x2="780" y2="76" stroke="#ede5db"/>

  <!-- Shipping address snippet -->
  <g transform="translate(40, 95)">
    <text x="0" y="0" font-size="12" fill="#8c8273">House No., Street, Subdivision/Barangay, City, Province, Postal Code</text>
  </g>

  <!-- Order Notes -->
  <g transform="translate(40, 135)">
    <text x="0" y="0" font-size="10.5" font-weight="700" fill="#665e54" letter-spacing="1">ORDER NOTES (OPTIONAL)</text>
    <rect y="12" width="700" height="42" fill="#faf8f5" stroke="#e8e2db"/>
    <text x="14" y="38" font-size="12" fill="#8c8273">Special instructions for fragile handling...</text>
  </g>

  <line x1="40" y1="215" x2="740" y2="215" stroke="#ede5db"/>

  <!-- SELECT PAYMENT OPTION Title -->
  <g transform="translate(40, 245)">
    <text x="0" y="0" font-size="10.5" font-weight="700" fill="#a48a6d" letter-spacing="2">SELECT PAYMENT OPTION</text>
  </g>

  <!-- 5 Payment Buttons Grid matching Image 6 -->
  <g transform="translate(40, 265)">
    <!-- GCash (Selected: light blue background, blue border) -->
    <g transform="translate(0, 0)">
      <rect width="220" height="52" fill="#eaf4ff" stroke="#007cff" stroke-width="1.5"/>
      <circle cx="46" cy="26" r="14" fill="#007cff"/>
      <text x="46" y="31" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">G</text>
      <text x="70" y="32" font-size="17" font-weight="700" fill="#007cff">GCash</text>
    </g>

    <!-- BANK TRANSFER -->
    <g transform="translate(238, 0)">
      <rect width="220" height="52" fill="#f4f1ee" stroke="#e8e2db"/>
      <g transform="translate(56, 17)">
        <rect width="18" height="18" fill="#1c1c1c" rx="2"/>
        <text x="9" y="14" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">🏛</text>
      </g>
      <text x="84" y="26" font-size="10.5" font-weight="700" fill="#1c1c1c">BANK</text>
      <text x="84" y="39" font-size="9" font-weight="700" fill="#a48a6d">TRANSFER</text>
    </g>

    <!-- COD CASH -->
    <g transform="translate(476, 0)">
      <rect width="224" height="52" fill="#f4f1ee" stroke="#e8e2db"/>
      <g transform="translate(68, 17)">
        <rect width="18" height="18" fill="#ff7a00" rx="2"/>
        <text x="9" y="14" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">🚚</text>
      </g>
      <text x="96" y="26" font-size="10.5" font-weight="700" fill="#1c1c1c">COD</text>
      <text x="96" y="39" font-size="9" font-weight="700" fill="#ff7a00">CASH</text>
    </g>

    <!-- Maya -->
    <g transform="translate(0, 64)">
      <rect width="220" height="52" fill="#f4f1ee" stroke="#e8e2db"/>
      <text x="110" y="33" text-anchor="middle" font-size="20" font-weight="700" fill="#00d588" letter-spacing="-0.5">maya</text>
    </g>

    <!-- PayPal -->
    <g transform="translate(238, 64)">
      <rect width="220" height="52" fill="#f4f1ee" stroke="#e8e2db"/>
      <text x="110" y="33" text-anchor="middle" font-size="19" font-style="italic" font-weight="700" fill="#003087">Pay<tspan fill="#0079c1">Pal</tspan></text>
    </g>
  </g>

  <!-- Blue GCash Checkout Container Box matching Image 6 -->
  <g transform="translate(40, 400)">
    <rect width="700" height="375" fill="#fdfefe" stroke="#b9ddff" stroke-width="1.2"/>

    <!-- GCash Header inside Box -->
    <g transform="translate(24, 26)">
      <circle cx="16" cy="16" r="15" fill="#007cff"/>
      <text x="16" y="22" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">G</text>
      <text x="42" y="23" font-size="17" font-weight="700" fill="#007cff">GCash</text>

      <g transform="translate(130, 2)">
        <text x="0" y="12" font-size="11.5" font-weight="700" fill="#0060c4" letter-spacing="1">GCASH CHECKOUT</text>
        <text x="0" y="25" font-size="10" fill="#665e54">Instant Verification</text>
      </g>

      <g transform="translate(420, 2)">
        <text x="160" y="12" text-anchor="end" font-size="12" font-weight="600" fill="#0060c4">jeric delos reyes</text>
        <text x="160" y="27" text-anchor="end" font-size="13.5" font-weight="700" fill="#007cff">09213447573</text>
        <!-- Blue Copy Icon Button -->
        <g transform="translate(172, 2)">
          <rect width="32" height="32" rx="4" fill="#007cff"/>
          <g transform="translate(8, 8)">
            <rect width="10" height="10" rx="1" fill="none" stroke="#ffffff" stroke-width="1.5"/>
            <path d="M4 14 L14 14 L14 4" fill="none" stroke="#ffffff" stroke-width="1.5"/>
          </g>
        </g>
      </g>
    </g>

    <!-- Scan Card Frame -->
    <g transform="translate(24, 76)">
      <rect width="652" height="235" fill="#ffffff" stroke="#e8e2db"/>

      <!-- Stylized Card/QR Graphic matching screenshot -->
      <g transform="translate(196, 45)">
        <rect width="260" height="120" rx="4" fill="#f4f1ee" stroke="#e8e2db"/>
        <!-- Black card angled illustration -->
        <g transform="translate(100, 15) rotate(25)">
          <rect width="80" height="52" rx="5" fill="#201f1e"/>
          <circle cx="20" cy="26" r="6" fill="#a48a6d"/>
          <rect x="52" y="32" width="16" height="8" rx="2" fill="#ffffff" opacity="0.8"/>
        </g>
        <text x="130" y="105" text-anchor="middle" font-size="11" font-weight="700" fill="#007cff" letter-spacing="1">SCAN TO PAY VIA GCASH</text>
      </g>
    </g>

    <!-- Instructions Text -->
    <text x="24" y="340" font-size="11.5" fill="#007cff">Open your GCash app, tap Express Send or Scan QR, and transfer the exact total amount.</text>
  </g>

  <!-- Bottom Amount & Actions -->
  <g transform="translate(40, 810)">
    <line x1="0" y1="0" x2="700" y2="0" stroke="#ede5db"/>
    
    <g transform="translate(0, 32)">
      <text x="0" y="0" font-size="16" font-weight="600" fill="#1c1c1c">Amount Due</text>
      <text x="700" y="0" text-anchor="end" class="serif" font-size="30" font-weight="700" fill="#1c1c1c">₱6,450</text>
    </g>

    <g transform="translate(0, 60)">
      <!-- BACK Button -->
      <rect width="115" height="50" fill="#f4f1ee" stroke="#e8e2db"/>
      <text x="57" y="30" text-anchor="middle" font-size="12" font-weight="700" fill="#1c1c1c" letter-spacing="1.5">BACK</text>

      <!-- CONFIRM & PLACE ORDER Button -->
      <rect x="135" width="565" height="50" fill="#1c1c1c"/>
      <text x="417" y="30" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="2">CONFIRM &amp; PLACE ORDER</text>
    </g>
  </g>
</svg>