<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&amp;display=swap');
      text { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
      .serif { font-family: 'Playfair Display', Georgia, serif; }
    </style>
    <filter id="shadow-soft" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#1e1814" flood-opacity="0.06"/>
    </filter>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#1e1814" flood-opacity="0.05"/>
    </filter>
    <linearGradient id="sandstoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e8d8"/>
      <stop offset="50%" stop-color="#e8d5be"/>
      <stop offset="100%" stop-color="#dbc2a4"/>
    </linearGradient>
    <linearGradient id="travertineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf8f0"/>
      <stop offset="100%" stop-color="#eedfc8"/>
    </linearGradient>
  </defs>


  <rect width="1920" height="1080" fill="#fffaf5"/>
  
  <!-- Navigation Header -->
  <g transform="translate(100, 36)">
    <!-- Brand -->
    <text x="0" y="24" class="serif" font-size="22" font-weight="700" fill="#1e1814" letter-spacing="3">SERENA HEART CRYSTALS</text>
    <text x="380" y="24" font-size="10" font-weight="600" fill="#b8860b" letter-spacing="2">STUDIO &amp; HOMEWARES</text>

    <!-- Nav Links -->
    <g transform="translate(850, 24)">
      <text x="0" y="0" font-size="11.5" font-weight="600" fill="#b8860b" letter-spacing="2">COLLECTIONS</text>
      <text x="160" y="0" font-size="11.5" font-weight="600" fill="#665e54" letter-spacing="2">PHILOSOPHY</text>
      <text x="310" y="0" font-size="11.5" font-weight="600" fill="#665e54" letter-spacing="2">CURATION</text>
      <text x="440" y="0" font-size="11.5" font-weight="600" fill="#665e54" letter-spacing="2">ADMIN STUDIO</text>
    </g>

    <!-- Bag Action -->
    <g transform="translate(1550, 6)">
      <rect width="170" height="42" fill="#1e1814"/>
      <text x="85" y="26" text-anchor="middle" font-size="11" font-weight="600" fill="#fff1e6" letter-spacing="2">SHOPPING BAG (2)</text>
    </g>
  </g>
  <line x1="100" y1="92" x2="1820" y2="92" stroke="#ebd5bf" stroke-width="1"/>


  <!-- Modal Backdrop Overlay -->
  <rect width="1920" height="1080" fill="#1e1814" fill-opacity="0.6"/>

  <!-- Modal Window Container -->
  <g transform="translate(260, 110)" filter="url(#shadow-soft)">
    <rect width="1400" height="840" rx="4" fill="#fffaf5" stroke="#ebd5bf"/>

    <!-- Left Gallery View -->
    <g transform="translate(40, 40)">
      <rect width="640" height="620" fill="url(#sandstoneGrad)"/>
      <ellipse cx="320" cy="540" rx="180" ry="32" fill="#cbb296" opacity="0.6"/>
      <path d="M 210 520 C 160 380, 180 230, 230 130 C 270 70, 370 70, 410 130 C 460 230, 480 380, 430 520 Z" fill="#e4d1bc" stroke="#cbb296" stroke-width="4"/>
      <ellipse cx="320" cy="130" rx="80" ry="18" fill="#3d332d"/>
      
      <!-- Thumbnails -->
      <g transform="translate(0, 640)">
        <rect width="100" height="100" fill="url(#sandstoneGrad)" stroke="#b8860b" stroke-width="2"/>
        <rect x="120" width="100" height="100" fill="#eedfc8" stroke="#ebd5bf"/>
        <rect x="240" width="100" height="100" fill="#dfcebc" stroke="#ebd5bf"/>
      </g>
    </g>

    <!-- Right Specs & Order Form -->
    <g transform="translate(730, 60)">
      <text x="0" y="0" font-size="11" font-weight="700" fill="#b8860b" letter-spacing="3">VESSELS • NATURAL STONE</text>
      <text x="0" y="44" class="serif" font-size="38" fill="#1e1814">The Solis Sandstone Vessel</text>
      <text x="0" y="78" font-size="14" fill="#665e54">Hand-Carved Natural Australian Sandstone</text>

      <g transform="translate(0, 110)">
        <text x="0" y="0" class="serif" font-size="34" font-weight="700" fill="#1e1814">₱4,850</text>
        <text x="140" y="-4" font-size="16" text-decoration="line-through" fill="#8c8273">₱6,930</text>
        <rect x="230" y="-24" width="90" height="26" fill="#b8860b"/>
        <text x="275" y="-6" text-anchor="middle" font-size="11" font-weight="700" fill="#fff8f3">30% OFF</text>
      </g>

      <line x1="0" y1="140" x2="620" y2="140" stroke="#ebd5bf"/>

      <g transform="translate(0, 175)">
        <text x="0" y="0" font-size="14" fill="#665e54" width="600">Carved from a solid block of natural warm sandstone, The Solis Vessel celebrates the raw texture and sedimentary banding of stone. Designed to stand alone as a sculptural centerpiece or to hold dried botanical arrangements.</text>
      </g>

      <!-- Specifications Grid -->
      <g transform="translate(0, 270)">
        <rect width="620" height="130" fill="#fcf4eb" stroke="#ebd5bf"/>
        
        <g transform="translate(24, 28)">
          <text x="0" y="10" font-size="10.5" font-weight="700" fill="#b8860b" letter-spacing="2">DIMENSIONS</text>
          <text x="0" y="32" font-size="13.5" font-weight="600" fill="#1e1814">28cm (H) x 18cm (W) • 4.2 kg</text>
        </g>

        <g transform="translate(320, 28)">
          <text x="0" y="10" font-size="10.5" font-weight="700" fill="#b8860b" letter-spacing="2">ORIGIN &amp; FINISH</text>
          <text x="0" y="32" font-size="13.5" font-weight="600" fill="#1e1814">Natural Honed &amp; Chiseled Sandstone</text>
        </g>

        <g transform="translate(24, 85)">
          <text x="0" y="10" font-size="10.5" font-weight="700" fill="#b8860b" letter-spacing="2">AVAILABILITY</text>
          <text x="0" y="32" font-size="13.5" font-weight="600" fill="#047857">In Stock (8 pieces ready for dispatch)</text>
        </g>
      </g>

      <!-- Payment Support Badges -->
      <g transform="translate(0, 430)">
        <text x="0" y="16" font-size="11" font-weight="700" fill="#665e54" letter-spacing="1.5">ACCEPTED PHILIPPINE PAYMENTS:</text>
        <g transform="translate(0, 32)">
          <rect width="130" height="34" rx="4" fill="#007dfa"/>
          <text x="65" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">GCash QR</text>

          <rect x="145" width="150" height="34" rx="4" fill="#6c1d45"/>
          <text x="220" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">BPI Bank Transfer</text>

          <rect x="310" width="150" height="34" rx="4" fill="#0b2f6d"/>
          <text x="385" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">BDO Online Pay</text>
        </g>
      </g>

      <!-- Action Button -->
      <g transform="translate(0, 560)">
        <rect width="620" height="56" fill="#1e1814"/>
        <text x="310" y="35" text-anchor="middle" font-size="13" font-weight="700" fill="#fff1e6" letter-spacing="2.5">ADD TO SHOPPING BAG • ₱4,850</text>
      </g>
    </g>
  </g>
</svg>
