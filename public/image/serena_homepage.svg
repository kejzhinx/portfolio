<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&amp;display=swap');
      text { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
      .serif { font-family: 'Playfair Display', Georgia, serif; }
    </style>
    <filter id="shadow-soft" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#1e1814" flood-opacity="0.06"/>
    </filter>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#1e1814" flood-opacity="0.05"/>
    </filter>
    <linearGradient id="sandstoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e8d8"/>
      <stop offset="50%" stop-color="#e8d5be"/>
      <stop offset="100%" stop-color="#dbc2a4"/>
    </linearGradient>
    <linearGradient id="travertineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf8f0"/>
      <stop offset="100%" stop-color="#eedfc8"/>
    </linearGradient>
  </defs>


  <rect width="1920" height="1080" fill="#fffaf5"/>
  
  <!-- Navigation Header -->
  <g transform="translate(100, 36)">
    <!-- Brand -->
    <text x="0" y="24" class="serif" font-size="22" font-weight="700" fill="#1e1814" letter-spacing="3">SERENA HEART CRYSTALS</text>
    <text x="380" y="24" font-size="10" font-weight="600" fill="#b8860b" letter-spacing="2">STUDIO &amp; HOMEWARES</text>

    <!-- Nav Links -->
    <g transform="translate(850, 24)">
      <text x="0" y="0" font-size="11.5" font-weight="600" fill="#b8860b" letter-spacing="2">COLLECTIONS</text>
      <text x="160" y="0" font-size="11.5" font-weight="600" fill="#665e54" letter-spacing="2">PHILOSOPHY</text>
      <text x="310" y="0" font-size="11.5" font-weight="600" fill="#665e54" letter-spacing="2">CURATION</text>
      <text x="440" y="0" font-size="11.5" font-weight="600" fill="#665e54" letter-spacing="2">ADMIN STUDIO</text>
    </g>

    <!-- Bag Action -->
    <g transform="translate(1550, 6)">
      <rect width="170" height="42" fill="#1e1814"/>
      <text x="85" y="26" text-anchor="middle" font-size="11" font-weight="600" fill="#fff1e6" letter-spacing="2">SHOPPING BAG (2)</text>
    </g>
  </g>
  <line x1="100" y1="92" x2="1820" y2="92" stroke="#ebd5bf" stroke-width="1"/>


  <!-- Hero Content Grid -->
  <g transform="translate(100, 150)">
    <!-- Left Editorial Hero Text -->
    <g transform="translate(0, 40)">
      <rect width="180" height="26" fill="#fcf4eb" stroke="#ebd5bf" stroke-width="1"/>
      <text x="90" y="17" text-anchor="middle" font-size="10" font-weight="700" fill="#b8860b" letter-spacing="2.5">RAW STONE ARCHITECTURE</text>
      
      <text x="0" y="95" class="serif" font-size="56" fill="#1e1814" font-weight="400" line-height="1.1">Sculptural Homeliness</text>
      <text x="0" y="155" class="serif" font-size="56" fill="#1e1814" font-style="italic" font-weight="400">In Solid Earth &amp; Stone.</text>

      <text x="0" y="225" font-size="16" fill="#665e54" width="650">Carved from solid blocks of raw Australian sandstone and Roman travertine limestone. Each piece is hand-chiseled to create timeless tactile focal points for elevated living spaces.</text>

      <!-- CTAs -->
      <g transform="translate(0, 310)">
        <rect width="210" height="52" fill="#1e1814"/>
        <text x="105" y="32" text-anchor="middle" font-size="12" font-weight="600" fill="#fff1e6" letter-spacing="2">EXPLORE SHOP →</text>

        <rect x="230" width="190" height="52" fill="none" stroke="#1e1814" stroke-width="1"/>
        <text x="325" y="32" text-anchor="middle" font-size="12" font-weight="600" fill="#1e1814" letter-spacing="2">OUR PHILOSOPHY</text>
      </g>

      <!-- 3 Key Features Strip -->
      <g transform="translate(0, 440)">
        <line x1="0" y1="0" x2="680" y2="0" stroke="#ebd5bf" stroke-width="1"/>
        
        <g transform="translate(0, 24)">
          <text x="0" y="12" font-size="10" font-weight="700" fill="#b8860b" letter-spacing="2">01 / MATERIAL</text>
          <text x="0" y="32" class="serif" font-size="14" fill="#1e1814">100% Raw Sandstone &amp; Travertine</text>
        </g>

        <g transform="translate(240, 24)">
          <text x="0" y="12" font-size="10" font-weight="700" fill="#b8860b" letter-spacing="2">02 / CRAFT</text>
          <text x="0" y="32" class="serif" font-size="14" fill="#1e1814">Hand-Chiseled &amp; Honed Finish</text>
        </g>

        <g transform="translate(470, 24)">
          <text x="0" y="12" font-size="10" font-weight="700" fill="#b8860b" letter-spacing="2">03 / PAYMENT</text>
          <text x="0" y="32" class="serif" font-size="14" fill="#1e1814">Instant GCash &amp; Bank Transfer</text>
        </g>
      </g>
    </g>

    <!-- Right Featured Hero Piece: The Solis Sandstone Vessel -->
    <g transform="translate(860, 0)" filter="url(#shadow-soft)">
      <rect width="860" height="740" fill="#fff8f3" stroke="#ebd5bf" stroke-width="1"/>
      
      <!-- Stone Image Frame -->
      <g transform="translate(40, 40)">
        <rect width="780" height="460" fill="url(#sandstoneGrad)"/>
        
        <!-- Artistic Minimal Vessel Silhouette Illustration -->
        <ellipse cx="390" cy="400" rx="140" ry="25" fill="#cbb296" opacity="0.6"/>
        <path d="M 310 390 C 270 300, 280 200, 320 120 C 350 80, 430 80, 460 120 C 500 200, 510 300, 470 390 Z" fill="#e4d1bc" stroke="#cbb296" stroke-width="3"/>
        <ellipse cx="390" cy="120" rx="60" ry="14" fill="#3d332d"/>
        <ellipse cx="390" cy="118" rx="55" ry="12" fill="#5c4d44"/>
        <!-- Texture banding -->
        <path d="M 285 240 Q 390 270 495 240" stroke="#d5beaa" stroke-width="4" fill="none" opacity="0.8"/>
        <path d="M 278 280 Q 390 310 502 280" stroke="#cbb296" stroke-width="5" fill="none" opacity="0.8"/>

        <!-- Badges -->
        <g transform="translate(24, 24)">
          <rect width="130" height="28" fill="#fff8f3" stroke="#ebd5bf"/>
          <text x="65" y="18" text-anchor="middle" font-size="9" font-weight="700" fill="#1e1814" letter-spacing="2">CURATED VESSEL</text>
        </g>
        <g transform="translate(640, 24)">
          <rect width="116" height="28" fill="#b8860b"/>
          <text x="58" y="18" text-anchor="middle" font-size="9.5" font-weight="700" fill="#fff8f3" letter-spacing="1">ONLY 8 LEFT</text>
        </g>
      </g>

      <!-- Editorial Card Bottom Info -->
      <g transform="translate(50, 540)">
        <text x="0" y="24" font-size="11" font-weight="700" fill="#b8860b" letter-spacing="2.5">NATURAL AUSTRALIAN SANDSTONE</text>
        <text x="0" y="60" class="serif" font-size="32" font-weight="400" fill="#1e1814">The Solis Sandstone Vessel</text>
        <text x="0" y="88" font-size="14" fill="#665e54">28cm (H) x 18cm (W) • 4.2 kg solid honed sandstone with natural sedimentary grain.</text>

        <!-- Price and Bag Action -->
        <g transform="translate(0, 120)">
          <line x1="0" y1="0" x2="760" y2="0" stroke="#ebd5bf" stroke-width="1"/>
          <g transform="translate(0, 35)">
            <text x="0" y="0" font-size="13" text-decoration="line-through" fill="#8c8273">₱6,930</text>
            <text x="70" y="2" class="serif" font-size="30" font-weight="700" fill="#1e1814">₱4,850</text>
            <rect x="200" y="-18" width="80" height="24" fill="#b8860b"/>
            <text x="240" y="-2" text-anchor="middle" font-size="10" font-weight="700" fill="#fff8f3">30% OFF</text>
          </g>

          <g transform="translate(580, 16)">
            <rect width="180" height="46" fill="#1e1814"/>
            <text x="90" y="28" text-anchor="middle" font-size="11.5" font-weight="600" fill="#fff8f3" letter-spacing="2">+ ADD TO BAG</text>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
